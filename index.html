  st: ["Rinse the mussels and discard any with cracked shells or that stay open when tapped.", "Melt 2 tbsp butter in a large pot over medium heat. Cook the shallots 3 minutes, then the garlic and red pepper flakes 1 minute.", "Add the wine, bring to a boil and simmer 2 minutes. Add the mussels, cover and steam over high heat 5 to 7 minutes, shaking the pot, until they open.", "Lift the mussels into bowls, discarding any that stayed closed. Stir the cream, remaining butter, parsley and pepper into the broth.", "Pour the broth over the mussels and serve with lemon wedges and bread."] },

{ id: "seafood-paella", n: "Seafood Paella", c: "seafood", s: "6", t: "1 hr 15 min",
  d: "Saffron rice with chorizo, chicken, shrimp and mussels, cooked to form a crispy socarrat.",
  i: [[0.25, "cup", "olive oil"], [4, "oz", "Spanish chorizo", "sliced"], [1, "lb", "boneless skinless chicken thighs", "cut in 1-inch pieces"], [1, "", "yellow onion", "finely chopped"], [1, "", "red bell pepper", "diced"], [4, "clove", "garlic", "minced"], [2, "", "roma tomato", "grated, skins discarded"], [2, "tsp", "smoked paprika"], [0.5, "tsp", "saffron threads"], [2, "cup", "bomba rice"], [5, "cup", "chicken broth", "hot"], [1, "lb", "large shrimp, peeled and deveined"], [1, "lb", "mussels", "scrubbed and debearded"], [0.5, "cup", "frozen peas"], [2, "tbsp", "fresh parsley", "chopped"], [1, "", "lemon", "cut in wedges"], [null, "", "salt"]],
  st: ["Crumble the saffron into the hot broth to steep. Heat the oil in a 14- to 15-inch paella pan over medium-high heat. Brown the chorizo and chicken 6 to 8 minutes, seasoning with salt.", "Add the onion and bell pepper and cook 5 minutes, then the garlic, tomatoes and paprika for 3 minutes until jammy.", "Stir in the rice to coat, then pour in the saffron broth and 1 tsp salt. Spread the rice evenly and bring to a boil. Do not stir from here on.", "Simmer over medium-low 15 minutes, rotating the pan for even heat. Press in the shrimp and mussels and scatter over the peas.", "Cook 8 to 10 minutes more until the liquid is absorbed and the mussels open. Raise the heat 1 to 2 minutes until the bottom crackles and forms a crust.", "Cover loosely with foil and rest 5 minutes. Scatter with parsley and serve with lemon wedges."] },

{ id: "miso-glazed-cod", n: "Miso Glazed Cod", c: "seafood", s: "4", t: "20 min + marinating",
  d: "Nobu-inspired buttery cod marinated in sweet miso, then broiled until caramelized.",
  i: [[1.5, "lb", "cod fillets", "or black cod, cut in 4 pieces"], [0.5, "cup", "white miso paste"], [3, "tbsp", "mirin"], [3, "tbsp", "sake"], [3, "tbsp", "granulated sugar"], [2, "", "green onion", "thinly sliced"], [1, "tsp", "sesame seeds"]],
  st: ["Bring the mirin and sake to a boil in a small saucepan for 20 seconds. Lower the heat, whisk in the miso and sugar until dissolved, and cool completely.", "Pat the fish dry, coat with the marinade in a dish, cover and refrigerate at least 24 hours and up to 3 days.", "Heat the broiler with a rack 6 inches from the heat and line a sheet pan with foil. Wipe most of the marinade off the fish.", "Broil 8 to 10 minutes until the top is deeply caramelized in spots and the fish flakes easily.", "Garnish with green onions and sesame seeds and serve with rice."] },

{ id: "shrimp-etouffee", n: "Shrimp Étouffée", c: "seafood", s: "6", t: "1 hr",
  d: "Louisiana shrimp smothered in a buttery blond roux sauce with the holy trinity, served over rice.",
  i: [[0.5, "cup", "unsalted butter"], [0.5, "cup", "all-purpose flour"], [1, "", "yellow onion", "finely chopped"], [1, "", "green bell pepper", "finely chopped"], [2, "stalk", "celery", "finely chopped"], [4, "clove", "garlic", "minced"], [1, "tbsp", "tomato paste"], [2, "tsp", "Cajun seasoning"], [2, "cup", "bottled clam juice", "or seafood stock"], [1, "", "bay leaf"], [2, "lb", "large shrimp, peeled and deveined"], [1, "tsp", "cayenne hot sauce"], [1, "tsp", "Worcestershire sauce"], [3, "", "green onion", "sliced"], [2, "tbsp", "fresh parsley", "chopped"], [1.5, "cup", "long-grain white rice"], [null, "", "salt"]],
  st: ["Cook the rice according to the package.", "Melt the butter in a Dutch oven over medium heat. Whisk in the flour and cook, stirring constantly, 10 to 12 minutes until the roux is the color of peanut butter.", "Add the onion, bell pepper and celery and cook 6 to 8 minutes until soft. Stir in the garlic, tomato paste and Cajun seasoning for 1 minute.", "Gradually whisk in the clam juice and 1 cup water, add the bay leaf, and simmer 15 minutes until thickened.", "Stir in the shrimp, hot sauce and Worcestershire and simmer 5 minutes until the shrimp are just pink. Season with salt and discard the bay leaf.", "Stir in the green onions and parsley and serve over rice."] },

// ---------- Pasta ----------
{ id: "spaghetti-and-meatballs", n: "Spaghetti and Meatballs", c: "pasta", s: "6", t: "1 hr 15 min",
  d: "Tender beef and pork meatballs simmered in a simple, rich tomato sauce over spaghetti.",
  i: [[1, "lb", "ground beef"], [0.5, "lb", "ground pork"], [0.75, "cup", "panko breadcrumbs"], [0.5, "cup", "whole milk"], [1, "", "egg"], [0.75, "cup", "grated parmesan cheese", "plus more to serve"], [6, "clove", "garlic", "minced, divided"], [0.25, "cup", "fresh parsley", "chopped"], [3, "tbsp", "olive oil"], [1, "", "yellow onion", "finely chopped"], [2, "can", "crushed tomatoes (28 oz)"], [0.25, "cup", "fresh basil", "torn"], [1, "lb", "spaghetti"], [1.5, "tsp", "salt"], [null, "", "black pepper"]],
  st: ["Soak the panko in the milk 5 minutes. Add the beef, pork, egg, parmesan, half the garlic, parsley, 1 tsp salt and pepper and mix gently. Roll into 1 1/2-inch balls.", "Heat the oil in a Dutch oven over medium-high heat and brown the meatballs in batches on all sides, about 6 minutes. Set aside.", "Lower the heat to medium. Cook the onion 5 minutes, then the remaining garlic 1 minute. Add the tomatoes and 1/2 tsp salt and bring to a simmer.", "Return the meatballs, cover partially and simmer gently 25 to 30 minutes until cooked through. Stir in the basil.", "Meanwhile, cook the spaghetti in salted boiling water until al dente and drain.", "Toss the spaghetti with some of the sauce and serve topped with meatballs, more sauce and parmesan."] },

{ id: "pasta-puttanesca", n: "Pasta Puttanesca", c: "pasta", s: "4", t: "30 min",
  d: "A punchy Neapolitan pantry sauce of tomatoes, olives, capers, anchovies and chili.",
  i: [[1, "lb", "spaghetti"], [0.25, "cup", "olive oil"], [4, "clove", "garlic", "thinly sliced"], [4, "", "anchovy fillet", "chopped"], [0.5, "tsp", "red pepper flakes"], [1, "can", "whole peeled tomatoes (28 oz)", "crushed by hand"], [0.5, "cup", "kalamata olives", "pitted and halved"], [2, "tbsp", "capers", "rinsed"], [0.25, "cup", "fresh parsley", "chopped"], [null, "", "salt"]],
  st: ["Bring a large pot of salted water to a boil.", "Heat the oil in a large skillet over medium heat. Cook the garlic, anchovies and red pepper flakes 2 minutes, mashing the anchovies until they dissolve.", "Add the tomatoes, olives and capers and simmer 10 to 15 minutes until thickened.", "Cook the spaghetti until just shy of al dente and reserve 1/2 cup pasta water.", "Toss the pasta in the sauce with a splash of pasta water 1 to 2 minutes until coated. Season with salt and stir in the parsley."] },

{ id: "chicken-tetrazzini", n: "Chicken Tetrazzini", c: "pasta", s: "8", t: "1 hr",
  d: "Comforting baked spaghetti with chicken and mushrooms in a creamy sherry-parmesan sauce.",
  i: [[12, "oz", "spaghetti", "broken in half"], [4, "tbsp", "unsalted butter"], [8, "oz", "cremini mushrooms", "sliced"], [1, "", "yellow onion", "finely chopped"], [2, "clove", "garlic", "minced"], [0.33, "cup", "all-purpose flour"], [2, "cup", "chicken broth"], [1.5, "cup", "whole milk"], [0.5, "cup", "heavy cream"], [0.25, "cup", "dry sherry"], [1, "cup", "grated parmesan cheese", "divided"], [3, "cup", "rotisserie chicken", "shredded"], [1, "cup", "frozen peas"], [0.5, "tsp", "dried thyme"], [0.5, "cup", "panko breadcrumbs"], [null, "", "salt"], [null, "", "black pepper"]],
  st: ["Heat the oven to 375°F and butter a 9x13-inch baking dish. Cook the spaghetti in salted water 2 minutes short of al dente and drain.", "Melt the butter in a large pot over medium-high heat. Cook the mushrooms and onion 8 minutes until browned, then the garlic 1 minute.", "Sprinkle in the flour and stir 1 minute. Gradually whisk in the broth, milk, cream and sherry and simmer 5 minutes until thickened.", "Stir in 3/4 cup parmesan, the thyme, chicken, peas and spaghetti. Season with salt and pepper and spread in the dish.", "Toss the panko with the remaining parmesan, sprinkle over the top and bake 25 to 30 minutes until bubbling and golden."] },

{ id: "cajun-chicken-pasta", n: "Cajun Chicken Pasta", c: "pasta", s: "4", t: "35 min",
  d: "Spicy blackened chicken and peppers tossed with penne in a creamy parmesan Cajun sauce.",
  i: [[12, "oz", "penne"], [1.5, "lb", "boneless skinless chicken breasts", "cut in strips"], [2, "tbsp", "Cajun seasoning", "divided"], [1, "tbsp", "olive oil"], [2, "tbsp", "unsalted butter"], [1, "", "red bell pepper", "sliced"], [1, "", "green bell pepper", "sliced"], [0.5, "", "yellow onion", "sliced"], [3, "clove", "garlic", "minced"], [1.5, "cup", "heavy cream"], [0.5, "cup", "chicken broth"], [0.75, "cup", "grated parmesan cheese"], [2, "", "roma tomato", "diced"], [2, "", "green onion", "sliced"], [null, "", "salt"]],
  st: ["Cook the penne in salted boiling water until al dente and drain.", "Toss the chicken with 1 tbsp Cajun seasoning. Heat the oil in a large skillet over medium-high heat and cook the chicken 5 to 6 minutes until browned and cooked through. Remove.", "Melt the butter and cook the peppers and onion 5 minutes, then the garlic 30 seconds.", "Add the cream, broth and remaining Cajun seasoning and simmer 3 to 4 minutes. Stir in the parmesan until smooth and season with salt.", "Toss in the penne and chicken until coated. Top with the tomatoes and green onions."] },

{ id: "pasta-alla-norma", n: "Pasta alla Norma", c: "pasta", s: "4", t: "50 min",
  d: "Sicilian rigatoni with golden fried eggplant, garlicky tomato sauce, basil and salty ricotta salata.",
  i: [[1, "", "globe eggplant", "cut in 3/4-inch cubes"], [0.5, "cup", "olive oil", "divided"], [4, "clove", "garlic", "thinly sliced"], [0.25, "tsp", "red pepper flakes"], [1, "can", "whole peeled tomatoes (28 oz)", "crushed by hand"], [1, "lb", "rigatoni"], [0.5, "cup", "fresh basil", "torn"], [0.75, "cup", "ricotta salata", "grated"], [null, "", "salt"]],
  st: ["Toss the eggplant with 1 tsp salt and drain in a colander 30 minutes. Pat dry.", "Heat 1/3 cup oil in a large skillet over medium-high heat. Fry the eggplant in batches 6 to 8 minutes until deep golden and tender. Drain on paper towels.", "Lower the heat to medium, add the remaining oil, and cook the garlic and red pepper flakes 1 minute. Add the tomatoes and simmer 15 minutes. Season with salt.", "Meanwhile, cook the rigatoni in salted boiling water until al dente, reserving 1/2 cup pasta water.", "Toss the pasta with the sauce, most of the eggplant, half the basil and a splash of pasta water.", "Serve topped with the remaining eggplant and basil and plenty of ricotta salata."] },

{ id: "orecchiette-sausage-broccoli-rabe", n: "Orecchiette with Sausage and Broccoli Rabe", c: "pasta", s: "4", t: "35 min",
  d: "A Puglian favorite of little ear pasta with crumbled sausage, bitter greens, garlic and chili.",
  i: [[1, "lb", "broccoli rabe", "trimmed and cut in 2-inch pieces"], [1, "lb", "orecchiette"], [3, "tbsp", "olive oil"], [1, "lb", "Italian sausage", "casings removed"], [4, "clove", "garlic", "thinly sliced"], [0.5, "tsp", "red pepper flakes"], [0.5, "cup", "grated Pecorino Romano", "plus more to serve"], [null, "", "salt"]],
  st: ["Bring a large pot of salted water to a boil. Blanch the broccoli rabe 2 minutes, lift out with a slotted spoon and drain. Keep the water boiling.", "Cook the orecchiette in the same water until al dente and reserve 1 cup pasta water.", "Meanwhile, heat 2 tbsp oil in a large skillet over medium-high heat. Brown the sausage, breaking it into small pieces, 6 to 8 minutes.", "Add the remaining oil, garlic and red pepper flakes and cook 1 minute. Add the broccoli rabe and cook 2 minutes.", "Add the pasta and 1/2 cup pasta water and toss over the heat until glossy. Stir in the Pecorino, season with salt and serve with more cheese."] },

{ id: "spaghetti-aglio-e-olio", n: "Spaghetti Aglio e Olio", c: "pasta", s: "4", t: "20 min",
  d: "The ultimate Roman midnight pasta: spaghetti in golden garlic-infused olive oil with chili and parsley.",
  i: [[1, "lb", "spaghetti"], [0.5, "cup", "olive oil"], [8, "clove", "garlic", "thinly sliced"], [0.5, "tsp", "red pepper flakes"], [0.33, "cup", "fresh parsley", "finely chopped"], [0.25, "cup", "grated parmesan cheese", "optional"], [null, "", "salt"]],
  st: ["Bring a large pot of well-salted water to a boil and cook the spaghetti until just shy of al dente. Reserve 1 cup pasta water.", "Meanwhile, warm the oil and garlic in a large skillet over medium-low heat, stirring, 4 to 5 minutes until the garlic is pale golden. Do not let it brown.", "Add the red pepper flakes for 30 seconds, then carefully add 1/2 cup pasta water.", "Add the spaghetti and toss vigorously over medium heat 1 to 2 minutes until the sauce emulsifies, adding more pasta water as needed.", "Stir in the parsley, season with salt, and serve with parmesan if desired."] },

{ id: "creamy-tuscan-chicken-pasta", n: "Creamy Tuscan Chicken Pasta", c: "pasta", s: "4", t: "35 min",
  d: "Seared chicken and penne in a garlicky parmesan cream sauce with sun-dried tomatoes and spinach.",
  i: [[12, "oz", "penne"], [1.5, "lb", "boneless skinless chicken breasts", "cut in bite-size pieces"], [1, "tsp", "Italian seasoning"], [2, "tbsp", "olive oil"], [4, "clove", "garlic", "minced"], [0.5, "cup", "sun-dried tomatoes in oil", "drained and chopped"], [0.5, "cup", "chicken broth"], [1.5, "cup", "heavy cream"], [0.75, "cup", "grated parmesan cheese"], [3, "cup", "baby spinach"], [2, "tbsp", "fresh basil", "chopped"], [null, "", "salt"], [null, "", "black pepper"]],
  st: ["Cook the penne in salted boiling water until al dente and drain.", "Season the chicken with the Italian seasoning, salt and pepper. Heat the oil in a large skillet over medium-high heat and cook 6 to 7 minutes until golden and cooked through. Remove.", "Lower the heat to medium, add the garlic and sun-dried tomatoes and cook 1 minute. Pour in the broth and scrape up the browned bits.", "Stir in the cream and simmer 3 minutes, then add the parmesan until melted. Add the spinach and stir until wilted.", "Return the chicken and toss in the penne. Season with salt and pepper and top with basil."] },

{ id: "pad-thai", n: "Pad Thai", c: "pasta", s: "4", t: "40 min",
  d: "Thailand's classic stir-fried rice noodles with shrimp, egg and a sweet-sour tamarind sauce, topped with peanuts.",
  i: [[8, "oz", "flat rice noodles"], [3, "tbsp", "tamarind paste"], [3, "tbsp", "fish sauce"], [3, "tbsp", "brown sugar"], [1, "tsp", "sriracha"], [3, "tbsp", "vegetable oil", "divided"], [0.75, "lb", "large shrimp, peeled and deveined"], [1, "", "shallot", "thinly sliced"], [3, "clove", "garlic", "minced"], [2, "", "egg", "beaten"], [2, "cup", "bean sprouts"], [4, "", "green onion", "cut in 1-inch pieces"], [0.33, "cup", "roasted peanuts", "chopped"], [1, "", "lime", "cut in wedges"], [2, "tbsp", "fresh cilantro", "chopped"]],
  st: ["Soak the noodles in hot tap water 20 to 30 minutes until pliable but still firm. Drain.", "Whisk the tamarind, fish sauce, brown sugar and sriracha until the sugar dissolves.", "Heat 1 tbsp oil in a wok or large skillet over high heat. Cook the shrimp 1 to 2 minutes per side until pink and remove.", "Add the remaining oil, shallot and garlic and stir-fry 30 seconds. Push aside, add the eggs and scramble until just set.", "Add the noodles and sauce and toss 2 to 3 minutes until the noodles are tender and have absorbed the sauce, adding a splash of water if dry.", "Toss in the shrimp, bean sprouts and green onions for 1 minute. Serve topped with peanuts and cilantro with lime wedges."] },

{ id: "cold-sesame-noodles", n: "Cold Sesame Noodles", c: "pasta", s: "4", t: "25 min",
  d: "Chilled noodles in a nutty, tangy sesame sauce with crisp cucumber and a hint of heat.",
  i: [[12, "oz", "spaghetti"], [1, "tbsp", "toasted sesame oil", "plus 3 tbsp for the sauce"], [0.33, "cup", "tahini"], [3, "tbsp", "soy sauce"], [2, "tbsp", "rice vinegar"], [1, "tbsp", "honey"], [2, "clove", "garlic", "grated"], [1, "tbsp", "fresh ginger", "grated"], [1, "tsp", "sriracha"], [0.5, "", "English cucumber", "cut in matchsticks"], [3, "", "green onion", "thinly sliced"], [1, "tbsp", "sesame seeds", "toasted"]],
  st: ["Cook the spaghetti in salted boiling water until just tender. Drain, rinse under cold water until cool, and toss with 1 tbsp sesame oil.", "Whisk the tahini, soy sauce, vinegar, 3 tbsp sesame oil, honey, garlic, ginger and sriracha.", "Whisk in 2 to 4 tbsp warm water until the sauce is smooth and pourable.", "Toss the noodles with the sauce until coated.", "Top with the cucumber, green onions and sesame seeds and serve chilled or at room temperature."] }

const NEW_F = [
  {id:"vegetable-lasagna", n:"Vegetable Lasagna", c:"vegetarian", s:"8", t:"1 hr 45 min", d:"Hearty layers of sautéed zucchini, peppers, mushrooms and spinach with ricotta, mozzarella and marinara.", i:[[12,"","lasagna noodle"],[2,"tbsp","olive oil"],[1,"","yellow onion","diced"],[3,"clove","garlic","minced"],[2,"","zucchini","diced"],[1,"","red bell pepper","diced"],[8,"oz","cremini mushrooms","sliced"],[5,"cup","baby spinach"],[1,"tsp","dried oregano"],[4,"cup","marinara sauce"],[2,"cup","ricotta cheese"],[1,"","egg"],[1,"cup","grated parmesan cheese","divided"],[3,"cup","shredded mozzarella cheese","divided"],[0.25,"cup","fresh basil","chopped"],[null,"","salt"],[null,"","black pepper"]], st:["Heat the oven to 375°F. Boil the noodles in salted water until just al dente, then drain and lay flat on oiled foil.","Heat the oil in a large skillet over medium-high heat. Cook the onion, zucchini, bell pepper and mushrooms 8 to 10 minutes until browned and their liquid has evaporated. Add the garlic, oregano and spinach and cook 2 minutes until wilted; season with salt and pepper.","Mix the ricotta, egg, 1/2 cup parmesan, basil and a pinch of salt and pepper.","Spread 1 cup marinara in a 9x13-inch dish. Layer 4 noodles, half the ricotta, half the vegetables, 1 cup mozzarella and 1 cup sauce; repeat, then top with the last noodles, remaining sauce, mozzarella and parmesan.","Cover with foil and bake 25 minutes, then uncover and bake 20 to 25 minutes until bubbling and golden. Rest 15 minutes before slicing."]},
  {id:"lentil-shepherds-pie", n:"Lentil Shepherd's Pie", c:"vegetarian", s:"6", t:"1 hr 30 min", d:"Savory thyme-scented lentils and vegetables under a fluffy blanket of buttery mashed potatoes.", i:[[2.5,"lb","Yukon gold potatoes","peeled and cut in 2-inch chunks"],[4,"tbsp","unsalted butter"],[0.5,"cup","whole milk","warmed"],[2,"tbsp","olive oil"],[1,"","yellow onion","diced"],[2,"","carrot","diced"],[2,"stalk","celery","diced"],[3,"clove","garlic","minced"],[2,"tbsp","tomato paste"],[1,"cup","dried brown lentils","rinsed"],[3,"cup","vegetable broth"],[1,"tbsp","soy sauce"],[4,"sprig","fresh thyme"],[1,"cup","frozen peas"],[null,"","salt"],[null,"","black pepper"]], st:["Cover the potatoes with cold salted water, bring to a boil and simmer 15 to 20 minutes until tender. Drain and mash with the butter and warm milk; season with salt and pepper.","Meanwhile, heat the oil in a large ovenproof skillet over medium heat. Cook the onion, carrot and celery 8 minutes until softened, then add the garlic and tomato paste and cook 2 minutes.","Add the lentils, broth, soy sauce and thyme. Simmer, partly covered, 25 to 30 minutes until the lentils are tender and the mixture is thick. Discard the thyme stems, stir in the peas and season.","Heat the oven to 400°F. Spread the mashed potatoes over the lentils and rough up the top with a fork.","Bake 20 to 25 minutes until bubbling and the potato peaks are golden. Rest 10 minutes before serving."]},
  {id:"vegetable-fried-rice", n:"Vegetable Fried Rice", c:"vegetarian", s:"4", t:"25 min (plus chilling rice)", d:"Takeout-style fried rice with scrambled egg, peas, carrots and green onion in a savory soy glaze.", i:[[1.5,"cup","jasmine rice","cooked and chilled overnight (about 4 1/2 cups cooked)"],[3,"tbsp","vegetable oil","divided"],[3,"","egg","beaten"],[3,"clove","garlic","minced"],[1,"tbsp","fresh ginger","grated"],[1,"cup","frozen peas & carrots","thawed"],[4,"","green onion","sliced, whites and greens separated"],[3,"tbsp","soy sauce"],[1,"tsp","toasted sesame oil"]], st:["Break up any clumps in the cold rice with your hands.","Heat 1 tbsp oil in a large wok or skillet over medium-high heat. Scramble the eggs until just set, then transfer to a plate.","Add the remaining oil and heat until shimmering. Stir-fry the garlic, ginger and green onion whites 30 seconds, then the peas and carrots for 2 minutes.","Add the rice and stir-fry 4 to 5 minutes, pressing it against the pan, until hot and lightly toasted.","Add the soy sauce, sesame oil, eggs and green onion greens and toss 1 minute until evenly coated. Serve hot."]},
  {id:"palak-paneer", n:"Palak Paneer", c:"vegetarian", s:"4", t:"45 min", d:"Golden cubes of paneer in a silky, gently spiced spinach sauce finished with cream.", i:[[12,"cup","baby spinach"],[1,"","jalapeño","stemmed"],[3,"tbsp","vegetable oil","divided"],[12,"oz","paneer","cut in 3/4-inch cubes"],[1,"tsp","cumin seeds"],[1,"","yellow onion","finely diced"],[4,"clove","garlic","minced"],[1,"tbsp","fresh ginger","grated"],[2,"","roma tomato","finely diced"],[1,"tsp","ground coriander"],[1,"tsp","garam masala"],[0.5,"tsp","ground turmeric"],[0.25,"tsp","cayenne pepper"],[0.25,"cup","heavy cream"],[1.5,"cup","basmati rice"],[null,"","salt"]], st:["Cook the rice according to the package. Blanch the spinach in boiling water for 1 minute, plunge into ice water, then squeeze dry. Purée with the jalapeño and 1/4 cup water until smooth.","Heat 1 tbsp oil in a large skillet over medium-high heat. Brown the paneer 3 to 4 minutes, turning, then set aside.","Add the remaining oil and the cumin seeds and sizzle 30 seconds. Add the onion and cook 8 minutes until golden, then the garlic and ginger for 1 minute.","Add the tomatoes, coriander, garam masala, turmeric and cayenne and cook 5 minutes until the tomatoes break down.","Stir in the spinach purée and 1/2 tsp salt and simmer 5 minutes. Add the cream and paneer and simmer 2 minutes more. Serve with rice."]},
  {id:"sweet-potato-black-bean-chili", n:"Sweet Potato Black Bean Chili", c:"vegetarian", s:"6", t:"50 min", d:"Smoky, hearty meatless chili with tender sweet potatoes and black beans.", i:[[2,"tbsp","olive oil"],[1,"","yellow onion","diced"],[1,"","red bell pepper","diced"],[4,"clove","garlic","minced"],[2,"","sweet potato","peeled and cut in 1/2-inch cubes"],[2,"tbsp","chili powder"],[2,"tsp","ground cumin"],[1,"tsp","smoked paprika"],[0.5,"tsp","dried oregano"],[1,"can","diced tomatoes (14.5 oz)"],[2,"can","black beans (15 oz)","drained and rinsed"],[2,"cup","vegetable broth"],[1,"","lime","juiced"],[0.25,"cup","fresh cilantro","chopped"],[1,"","avocado","diced, to serve"],[null,"","salt"]], st:["Heat the oil in a large pot over medium heat. Cook the onion and bell pepper 6 minutes until softened, then add the garlic for 1 minute.","Add the sweet potatoes, chili powder, cumin, paprika, oregano and 1 tsp salt and stir 1 minute until fragrant.","Add the tomatoes, beans and broth. Bring to a boil, then cover and simmer 25 to 30 minutes until the sweet potatoes are tender.","Mash a few sweet potato pieces against the pot to thicken, and simmer uncovered 5 minutes if needed.","Stir in the lime juice, adjust the salt and serve topped with cilantro and avocado."]},
  {id:"stuffed-portobello-mushrooms", n:"Stuffed Portobello Mushrooms", c:"vegetarian", s:"4", t:"40 min", d:"Meaty balsamic-roasted portobello caps filled with garlicky spinach, tomato and melted cheese under a crisp panko top.", i:[[4,"","portobello mushroom","stems and gills removed"],[3,"tbsp","olive oil","divided"],[1,"tbsp","balsamic vinegar"],[1,"","shallot","minced"],[2,"clove","garlic","minced"],[4,"cup","baby spinach","chopped"],[1,"","roma tomato","seeded and diced"],[1,"cup","shredded mozzarella cheese"],[0.5,"cup","grated parmesan cheese","divided"],[0.5,"cup","panko breadcrumbs"],[2,"tbsp","fresh parsley","chopped"],[null,"","salt"],[null,"","black pepper"]], st:["Heat the oven to 400°F. Brush the mushroom caps with 2 tbsp oil and the vinegar, season with salt and pepper, and roast gill side up on a sheet pan 10 minutes. Pour off any liquid.","Meanwhile, heat the remaining oil in a skillet over medium heat. Cook the shallot 2 minutes, add the garlic and spinach and cook until wilted, then stir in the tomato and season.","Off the heat, stir the mozzarella and half the parmesan into the spinach. Mix the panko with the remaining parmesan.","Divide the filling among the caps and sprinkle with the panko mixture.","Bake 10 to 12 minutes until the cheese melts and the top is golden. Sprinkle with parsley and serve."]},
  {id:"spanakopita", n:"Spanakopita", c:"vegetarian", s:"8", t:"1 hr 30 min", d:"Greek spinach and feta pie layered in crisp, buttery phyllo, baked in a pan and cut into squares.", i:[[3,"pkg","frozen chopped spinach (10 oz)","thawed and squeezed dry"],[2,"tbsp","olive oil"],[1,"","yellow onion","finely diced"],[4,"","green onion","sliced"],[2,"clove","garlic","minced"],[2,"cup","crumbled feta cheese"],[3,"","egg","beaten"],[0.25,"cup","fresh dill","chopped"],[0.25,"cup","fresh parsley","chopped"],[0.25,"tsp","ground nutmeg"],[1,"pkg","frozen phyllo dough (16 oz)","thawed"],[0.75,"cup","unsalted butter","melted"],[null,"","black pepper"]], st:["Heat the oven to 375°F. Heat the oil in a skillet over medium heat and cook the onion and green onions 6 minutes until soft, then add the garlic for 1 minute. Cool slightly.","In a large bowl, mix the spinach, onion mixture, feta, eggs, dill, parsley, nutmeg and plenty of pepper.","Brush a 9x13-inch dish with butter. Layer 8 sheets of phyllo, brushing each with butter, keeping the rest covered with a damp towel.","Spread the filling evenly, then top with 8 more buttered sheets, tucking in the edges. Score the top into squares with a sharp knife.","Bake 45 to 50 minutes until deep golden and crisp. Cool 15 minutes, then cut along the scores."]},
  {id:"quinoa-buddha-bowls", n:"Quinoa Buddha Bowls", c:"vegetarian", s:"4", t:"45 min", d:"Nourishing bowls of quinoa, roasted sweet potatoes, crispy chickpeas and broccoli with a lemony tahini drizzle.", i:[[1,"cup","quinoa","rinsed"],[2,"","sweet potato","peeled and cut in 3/4-inch cubes"],[1,"can","chickpeas (15 oz)","drained, rinsed and patted dry"],[0.5,"lb","broccoli","cut in florets"],[3,"tbsp","olive oil"],[1,"tsp","smoked paprika"],[1,"tsp","ground cumin"],[0.25,"head","red cabbage","thinly shredded"],[1,"","carrot","shredded"],[1,"","avocado","sliced"],[0.25,"cup","tahini"],[1,"","lemon","juiced"],[1,"tbsp","maple syrup"],[1,"clove","garlic","grated"],[null,"","salt"],[null,"","black pepper"]], st:["Heat the oven to 425°F. Toss the sweet potatoes, chickpeas and broccoli with the oil, paprika, cumin, 1 tsp salt and pepper and spread on a large sheet pan.","Roast 25 minutes, stirring once, until the sweet potatoes are tender and the chickpeas are crisp.","Meanwhile, simmer the quinoa in 2 cups salted water, covered, 15 minutes until absorbed. Rest 5 minutes and fluff.","Whisk the tahini, lemon juice, maple syrup, garlic and a pinch of salt with 3 to 4 tbsp water until drizzly.","Divide the quinoa among bowls, arrange the roasted vegetables, cabbage, carrot and avocado on top, and drizzle with the dressing."]},
  {id:"mushroom-stroganoff", n:"Mushroom Stroganoff", c:"vegetarian", s:"4", t:"40 min", d:"Deeply browned mushrooms in a creamy sour cream and white wine sauce over buttered egg noodles.", i:[[12,"oz","wide egg noodles"],[2,"tbsp","olive oil"],[3,"tbsp","unsalted butter","divided"],[1.5,"lb","cremini mushrooms","sliced"],[1,"","yellow onion","thinly sliced"],[3,"clove","garlic","minced"],[3,"sprig","fresh thyme"],[1,"tsp","smoked paprika"],[2,"tbsp","all-purpose flour"],[0.25,"cup","dry white wine"],[1.5,"cup","vegetable broth"],[1,"tbsp","soy sauce"],[1,"tsp","Dijon mustard"],[0.75,"cup","sour cream","at room temperature"],[2,"tbsp","fresh parsley","chopped"],[null,"","salt"],[null,"","black pepper"]], st:["Cook the noodles in salted water according to the package. Drain and toss with 1 tbsp butter.","Heat the oil and 1 tbsp butter in a large skillet over medium-high heat. Cook the mushrooms in batches without stirring too often, 8 to 10 minutes, until well browned; season and set aside.","Melt the remaining butter and cook the onion 5 minutes until soft. Add the garlic, thyme and paprika for 1 minute, then stir in the flour for 1 minute.","Add the wine and let it bubble away, then whisk in the broth, soy sauce and mustard. Return the mushrooms and simmer 5 minutes until thickened.","Off the heat, discard the thyme stems and stir in the sour cream. Season and serve over the noodles with parsley."]},
  {id:"roasted-cauliflower-tacos", n:"Roasted Cauliflower Tacos", c:"vegetarian", s:"4", t:"40 min", d:"Smoky spice-roasted cauliflower in warm corn tortillas with crunchy cabbage, avocado and lime crema.", i:[[1,"head","cauliflower","cut in small florets"],[3,"tbsp","olive oil"],[1.5,"tsp","chili powder"],[1,"tsp","ground cumin"],[1,"tsp","smoked paprika"],[0.5,"tsp","garlic powder"],[0.5,"cup","sour cream"],[2,"","lime","1 zested and juiced, 1 in wedges"],[8,"","corn tortilla"],[0.25,"head","red cabbage","thinly shredded"],[1,"","avocado","sliced"],[0.5,"cup","crumbled queso fresco"],[0.25,"cup","fresh cilantro","chopped"],[null,"","salt"]], st:["Heat the oven to 425°F. Toss the cauliflower with the oil, chili powder, cumin, paprika, garlic powder and 1 tsp salt and spread on a sheet pan.","Roast 25 to 30 minutes, tossing once, until tender and well browned at the edges.","Stir the sour cream with the lime zest, juice and a pinch of salt.","Warm the tortillas in a dry skillet over medium-high heat, about 30 seconds per side.","Fill the tortillas with cauliflower, cabbage and avocado. Top with crema, queso fresco and cilantro and serve with lime wedges."]},

  {id:"creamed-spinach", n:"Creamed Spinach", c:"sides", s:"6", t:"25 min", d:"Steakhouse-style spinach in a rich, nutmeg-scented parmesan cream sauce.", i:[[2,"pkg","frozen chopped spinach (10 oz)","thawed and squeezed dry"],[3,"tbsp","unsalted butter"],[1,"","shallot","minced"],[2,"clove","garlic","minced"],[2,"tbsp","all-purpose flour"],[1,"cup","whole milk"],[0.5,"cup","heavy cream"],[0.5,"cup","grated parmesan cheese"],[0.125,"tsp","ground nutmeg"],[null,"","salt"],[null,"","black pepper"]], st:["Melt the butter in a saucepan over medium heat. Cook the shallot 2 minutes until soft, then add the garlic for 30 seconds.","Whisk in the flour and cook 1 minute without browning.","Slowly whisk in the milk and cream and simmer, whisking, 3 to 4 minutes until thickened.","Stir in the parmesan and nutmeg until melted, then add the spinach and cook 3 to 4 minutes until hot.","Season with salt and pepper and serve."]},
  {id:"scalloped-potatoes", n:"Scalloped Potatoes", c:"sides", s:"8", t:"1 hr 45 min", d:"Thinly sliced potatoes baked in a garlicky, thyme-scented cream sauce until tender and golden.", i:[[3,"lb","russet potato","peeled and sliced 1/8 inch thick"],[3,"tbsp","unsalted butter","plus more for the dish"],[1,"","yellow onion","thinly sliced"],[2,"clove","garlic","minced"],[3,"tbsp","all-purpose flour"],[2,"cup","whole milk"],[1,"cup","heavy cream"],[4,"sprig","fresh thyme","leaves only"],[null,"","salt"],[null,"","black pepper"]], st:["Heat the oven to 375°F and butter a 9x13-inch baking dish.","Melt the butter in a saucepan over medium heat. Cook the onion 5 minutes until soft, add the garlic for 30 seconds, then whisk in the flour for 1 minute.","Slowly whisk in the milk and cream with the thyme, 1 1/2 tsp salt and 1/2 tsp pepper. Simmer, whisking, 3 minutes until thickened.","Layer the potatoes in the dish, pouring sauce over each layer and finishing with sauce on top.","Cover with foil and bake 45 minutes, then uncover and bake 30 to 40 minutes until the potatoes are tender and the top is golden. Rest 10 minutes before serving."]},
  {id:"homestyle-baked-beans", n:"Homestyle Baked Beans", c:"sides", s:"8", t:"1 hr 30 min", d:"Sweet, smoky oven-baked beans with bacon, molasses and a tangy mustard-ketchup sauce.", i:[[6,"slice","thick-cut bacon","chopped"],[1,"","yellow onion","diced"],[4,"can","navy beans (15 oz)","drained and rinsed"],[0.5,"cup","ketchup"],[0.5,"cup","brown sugar","packed"],[0.25,"cup","molasses"],[1,"tbsp","yellow mustard"],[1,"tbsp","Worcestershire sauce"],[1,"tbsp","apple cider vinegar"],[null,"","salt"],[null,"","black pepper"]], st:["Heat the oven to 350°F. Cook the bacon in an ovenproof Dutch oven over medium heat until crisp, about 8 minutes. Spoon off all but 2 tbsp fat.","Add the onion and cook 5 minutes until softened.","Stir in the beans, ketchup, brown sugar, molasses, mustard, Worcestershire, vinegar and 1/2 cup water. Season with salt and pepper and bring to a simmer.","Transfer to the oven and bake uncovered 1 hour, stirring once or twice, until thick and glossy.","Rest 10 minutes before serving; the sauce will thicken further as it stands."]},
  {id:"mexican-street-corn", n:"Mexican Street Corn (Elote)", c:"sides", s:"6", t:"25 min", d:"Charred corn on the cob slathered in creamy garlic-lime sauce, rolled in cotija and dusted with chili powder.", i:[[6,"","fresh corn ear","husked"],[0.25,"cup","mayonnaise"],[0.25,"cup","sour cream"],[1,"clove","garlic","grated"],[2,"","lime","1 juiced, 1 in wedges"],[0.75,"cup","crumbled cotija cheese"],[1,"tsp","chili powder"],[2,"tbsp","fresh cilantro","chopped"],[null,"","salt"]], st:["Heat a grill or grill pan to medium-high.","Grill the corn 10 to 12 minutes, turning every few minutes, until tender and charred in spots.","Meanwhile, stir the mayonnaise, sour cream, garlic, lime juice and a pinch of salt together.","Brush the hot corn all over with the sauce, then roll or sprinkle with cotija.","Dust with chili powder, sprinkle with cilantro and serve with lime wedges."]},
  {id:"rice-pilaf", n:"Rice Pilaf", c:"sides", s:"6", t:"35 min", d:"Fluffy, buttery long-grain rice and toasted orzo simmered in savory broth.", i:[[3,"tbsp","unsalted butter"],[0.5,"cup","orzo pasta"],[0.5,"","yellow onion","finely diced"],[1,"clove","garlic","minced"],[1.5,"cup","long-grain white rice"],[3,"cup","chicken broth"],[2,"tbsp","fresh parsley","chopped"],[null,"","salt"],[null,"","black pepper"]], st:["Melt the butter in a saucepan over medium heat. Add the orzo and cook, stirring, 3 to 4 minutes until golden brown.","Add the onion and cook 3 minutes until soft, then the garlic for 30 seconds.","Stir in the rice and toast 2 minutes until the edges turn translucent.","Add the broth and 1/2 tsp salt and bring to a boil. Cover, reduce the heat to low and simmer 18 minutes until the liquid is absorbed.","Remove from the heat and rest, covered, 5 minutes. Fluff with a fork, season with pepper and stir in the parsley."]},
  {id:"roasted-asparagus", n:"Roasted Asparagus", c:"sides", s:"4", t:"20 min", d:"Tender-crisp oven-roasted asparagus with garlic, parmesan and a bright squeeze of lemon.", i:[[2,"lb","asparagus","woody ends trimmed"],[2,"tbsp","olive oil"],[2,"clove","garlic","minced"],[0.25,"cup","grated parmesan cheese"],[1,"","lemon","zested, then cut in wedges"],[null,"","salt"],[null,"","black pepper"]], st:["Heat the oven to 425°F.","Toss the asparagus with the oil, garlic, 1/2 tsp salt and pepper on a sheet pan and spread in a single layer.","Roast 10 to 12 minutes, depending on thickness, until tender-crisp and lightly browned.","Sprinkle with the parmesan and lemon zest and roast 1 to 2 minutes more until the cheese melts.","Squeeze lemon over the top and serve with the remaining wedges."]},
  {id:"homemade-dinner-rolls", n:"Homemade Dinner Rolls", c:"sides", s:"16", t:"2 hr 30 min (incl. rising)", d:"Soft, pillowy, buttery yeast rolls with golden tops, perfect for holiday tables.", i:[[1,"cup","whole milk","warmed to 110°F"],[2.25,"tsp","active dry yeast"],[0.25,"cup","granulated sugar"],[6,"tbsp","unsalted butter","melted and cooled, for the dough"],[1,"","egg","room temperature"],[1,"tsp","salt"],[3.5,"cup","all-purpose flour","plus more as needed"],[2,"tbsp","unsalted butter","melted, for brushing"]], st:["Stir the warm milk, yeast and 1 tbsp of the sugar in a large bowl and let stand 5 minutes until foamy.","Add the remaining sugar, melted butter, egg, salt and 2 cups flour and mix until smooth. Add the remaining flour gradually and knead 6 to 8 minutes until soft, smooth and only slightly tacky.","Place in a greased bowl, cover and let rise in a warm spot 1 to 1 1/2 hours until doubled.","Punch down, divide into 16 pieces and roll into tight balls. Arrange in a greased 9x13-inch pan, cover and let rise 45 minutes until puffy. Heat the oven to 375°F.","Bake 18 to 22 minutes until golden brown. Brush with the melted butter and serve warm."]},
  {id:"twice-baked-potatoes", n:"Twice-Baked Potatoes", c:"sides", s:"8", t:"1 hr 45 min", d:"Crisp potato skins refilled with a fluffy mash of sour cream, cheddar, bacon and green onion, then baked until golden.", i:[[4,"","russet potato","scrubbed"],[1,"tbsp","olive oil"],[4,"slice","thick-cut bacon","cooked and crumbled"],[4,"tbsp","unsalted butter","softened"],[0.5,"cup","sour cream"],[0.25,"cup","whole milk"],[1.5,"cup","shredded cheddar cheese","divided"],[3,"","green onion","sliced"],[null,"","salt"],[null,"","black pepper"]], st:["Heat the oven to 400°F. Rub the potatoes with the oil and salt, prick with a fork and bake directly on the rack 1 hour until tender.","Cool 10 minutes, then halve lengthwise and scoop the flesh into a bowl, leaving a 1/4-inch shell.","Mash the potato with the butter, sour cream and milk until smooth. Stir in 1 cup cheddar, most of the bacon and green onion, and season with salt and pepper.","Spoon the filling into the shells, top with the remaining cheddar and bacon, and set on a sheet pan.","Bake 15 to 20 minutes until heated through and the cheese is melted and golden. Sprinkle with the remaining green onion."]},
  {id:"classic-bread-stuffing", n:"Classic Bread Stuffing", c:"sides", s:"10", t:"1 hr 45 min", d:"Traditional holiday stuffing of dried bread cubes, buttery onion and celery, fresh herbs and broth, baked until crisp on top.", i:[[1.5,"lb","white sandwich bread","cut in 3/4-inch cubes"],[0.5,"cup","unsalted butter","plus more for the dish"],[1,"","yellow onion","diced"],[3,"stalk","celery","diced"],[1,"tbsp","fresh sage","chopped"],[1,"tbsp","fresh thyme","chopped"],[0.25,"cup","fresh parsley","chopped"],[2.5,"cup","chicken broth"],[2,"","egg","beaten"],[null,"","salt"],[null,"","black pepper"]], st:["Heat the oven to 275°F. Spread the bread cubes on two sheet pans and bake 30 to 40 minutes until dry but not browned. Raise the oven to 350°F and butter a 9x13-inch dish.","Melt the butter in a large skillet over medium heat. Cook the onion and celery 8 to 10 minutes until soft, then stir in the sage, thyme, 1 tsp salt and 1/2 tsp pepper.","In a large bowl, toss the bread with the vegetables and parsley. Whisk the broth with the eggs, pour over the bread and toss until evenly moistened.","Spread in the dish, cover with foil and bake 30 minutes.","Uncover and bake 20 to 30 minutes more until the top is golden and crisp."]},
  {id:"cucumber-tomato-salad", n:"Cucumber Tomato Salad", c:"sides", s:"6", t:"15 min", d:"Crisp cucumbers, juicy cherry tomatoes and red onion tossed in a simple herby red wine vinaigrette.", i:[[1,"","English cucumber","halved lengthwise and sliced"],[1,"pint","cherry tomatoes","halved"],[0.25,"","red onion","thinly sliced"],[3,"tbsp","olive oil"],[2,"tbsp","red wine vinegar"],[0.5,"tsp","dried oregano"],[0.5,"tsp","granulated sugar"],[2,"tbsp","fresh dill","chopped"],[null,"","salt"],[null,"","black pepper"]], st:["Soak the sliced onion in cold water 5 minutes to mellow it, then drain and pat dry.","Whisk the oil, vinegar, oregano, sugar, 1/2 tsp salt and pepper in a large bowl.","Add the cucumber, tomatoes, onion and dill and toss to coat.","Let stand 10 minutes so the flavors meld, then adjust the seasoning and serve."]},

  {id:"pumpkin-pie", n:"Pumpkin Pie", c:"desserts", s:"8", t:"4 hr (incl. cooling)", d:"The classic spiced holiday pie with a smooth, silky pumpkin custard in a flaky crust.", i:[[1,"pkg","refrigerated pie crusts (2-pack)","use 1 crust"],[0.75,"cup","granulated sugar"],[0.5,"tsp","salt"],[1,"tsp","ground cinnamon"],[0.5,"tsp","ground ginger"],[0.25,"tsp","ground cloves"],[2,"","egg"],[1,"can","pumpkin puree (15 oz)"],[1,"can","evaporated milk (12 oz)"]], st:["Heat the oven to 425°F. Fit the crust into a 9-inch deep-dish pie plate and crimp the edge.","Mix the sugar, salt, cinnamon, ginger and cloves in a small bowl.","Beat the eggs in a large bowl, then stir in the pumpkin and spice mixture. Gradually whisk in the evaporated milk until smooth.","Pour into the crust and bake 15 minutes, then reduce the oven to 350°F and bake 40 to 50 minutes until a knife inserted near the center comes out clean.","Cool on a rack at least 2 hours. Serve with whipped cream, or refrigerate."]},
  {id:"pecan-pie", n:"Pecan Pie", c:"desserts", s:"8", t:"4 hr (incl. cooling)", d:"A Southern classic with a gooey, buttery brown sugar filling under a crown of toasted pecans.", i:[[1,"pkg","refrigerated pie crusts (2-pack)","use 1 crust"],[3,"","egg"],[1,"cup","light corn syrup"],[1,"cup","brown sugar","packed"],[0.33,"cup","unsalted butter","melted"],[1,"tsp","vanilla extract"],[0.25,"tsp","salt"],[1.5,"cup","pecan halves"]], st:["Heat the oven to 350°F. Fit the crust into a 9-inch pie plate and crimp the edge.","Whisk the eggs in a large bowl, then whisk in the corn syrup, brown sugar, butter, vanilla and salt until smooth.","Scatter the pecans in the crust and pour the filling over them.","Bake 55 to 65 minutes until the edges are set and the center jiggles only slightly; cover the edge with foil if it browns too quickly.","Cool on a rack at least 2 hours to set before slicing."]},
  {id:"banana-pudding", n:"Banana Pudding", c:"desserts", s:"10", t:"4 hr 30 min (incl. chilling)", d:"Southern layered dessert of homemade vanilla custard, ripe bananas and vanilla wafers under whipped cream.", i:[[0.75,"cup","granulated sugar"],[0.33,"cup","all-purpose flour"],[0.25,"tsp","salt"],[3,"cup","whole milk"],[4,"","egg","yolks only"],[2,"tbsp","unsalted butter"],[2,"tsp","vanilla extract"],[1,"pkg","vanilla wafer cookies (11 oz)"],[4,"","ripe banana","sliced"],[1.5,"cup","heavy cream","cold"],[3,"tbsp","powdered sugar"]], st:["Whisk the sugar, flour and salt in a saucepan, then whisk in the milk and egg yolks until smooth.","Cook over medium heat, whisking constantly, 8 to 10 minutes until thick and bubbling. Remove from the heat and stir in the butter and vanilla.","In a 2-quart dish, layer one-third of the wafers, one-third of the bananas and one-third of the warm custard. Repeat twice.","Press plastic wrap onto the surface and chill at least 4 hours.","Before serving, whip the cream with the powdered sugar to soft peaks and spread over the pudding. Garnish with a few crushed wafers."]},
  {id:"bread-pudding", n:"Bread Pudding", c:"desserts", s:"8", t:"1 hr 30 min", d:"Old-fashioned baked bread pudding with a creamy cinnamon-vanilla custard, plump raisins and a golden top.", i:[[10,"slice","thick-sliced brioche bread","cut in 1-inch cubes, preferably day-old"],[0.25,"cup","unsalted butter","melted, plus more for the dish"],[0.5,"cup","raisins"],[4,"","egg"],[2,"cup","whole milk"],[1,"cup","heavy cream"],[0.75,"cup","granulated sugar"],[2,"tsp","vanilla extract"],[1,"tsp","ground cinnamon"],[0.25,"tsp","ground nutmeg"],[0.25,"tsp","salt"]], st:["Heat the oven to 350°F and butter a 9x13-inch baking dish.","Spread the bread in the dish, drizzle with the melted butter and scatter the raisins over it.","Whisk the eggs, milk, cream, sugar, vanilla, cinnamon, nutmeg and salt until smooth, then pour over the bread.","Press the bread down gently and let soak 20 minutes, pressing occasionally.","Bake 40 to 50 minutes until puffed, golden and just set in the center. Cool 15 minutes and serve warm."]},
  {id:"oatmeal-raisin-cookies", n:"Oatmeal Raisin Cookies", c:"desserts", s:"36", t:"45 min (plus chilling)", d:"Chewy, cinnamon-spiced oatmeal cookies with crisp edges and plenty of plump raisins.", i:[[1,"cup","unsalted butter","softened"],[1,"cup","brown sugar","packed"],[0.5,"cup","granulated sugar"],[2,"","egg","room temperature"],[2,"tsp","vanilla extract"],[1.5,"cup","all-purpose flour"],[1,"tsp","baking soda"],[1.5,"tsp","ground cinnamon"],[0.5,"tsp","salt"],[3,"cup","old-fashioned rolled oats"],[1.5,"cup","raisins"]], st:["Beat the butter and both sugars until light and fluffy, about 3 minutes. Beat in the eggs and vanilla.","Whisk the flour, baking soda, cinnamon and salt, then mix into the butter mixture on low until just combined.","Stir in the oats and raisins. Cover and chill the dough 30 minutes.","Heat the oven to 350°F and line baking sheets with parchment. Scoop 2-tbsp balls of dough 2 inches apart.","Bake 10 to 12 minutes until the edges are golden but the centers look slightly underdone. Cool 5 minutes on the sheet, then on a rack."]},
  {id:"red-velvet-cupcakes", n:"Red Velvet Cupcakes", c:"desserts", s:"24", t:"1 hr 30 min (incl. cooling)", d:"Tender, velvety buttermilk cupcakes with a hint of cocoa, topped with tangy cream cheese frosting.", i:[[2.5,"cup","all-purpose flour"],[1.5,"cup","granulated sugar"],[2,"tbsp","unsweetened cocoa powder"],[1,"tsp","baking soda"],[1,"tsp","salt"],[1.5,"cup","vegetable oil"],[1,"cup","buttermilk","room temperature"],[2,"","egg","room temperature"],[2,"tbsp","red food coloring"],[1,"tsp","distilled white vinegar"],[1,"tsp","vanilla extract","for the cupcakes"],[2,"pkg","cream cheese (8 oz)","softened"],[0.5,"cup","unsalted butter","softened"],[4,"cup","powdered sugar"],[2,"tsp","vanilla extract","for the frosting"]], st:["Heat the oven to 350°F and line two 12-cup muffin tins with paper liners.","Whisk the flour, sugar, cocoa, baking soda and salt in a large bowl. In another bowl, whisk the oil, buttermilk, eggs, food coloring, vinegar and vanilla.","Stir the wet ingredients into the dry until just smooth. Fill the liners two-thirds full.","Bake 18 to 22 minutes until a toothpick comes out clean. Cool 5 minutes in the pans, then completely on a rack.","For the frosting, beat the cream cheese and butter until smooth, then beat in the powdered sugar and vanilla until fluffy. Pipe or spread onto the cooled cupcakes."]},
  {id:"chocolate-mousse", n:"Chocolate Mousse", c:"desserts", s:"6", t:"3 hr 30 min (incl. chilling)", d:"Classic French mousse, airy yet intensely chocolatey, lightened with whipped egg whites and cream.", i:[[6,"oz","bittersweet chocolate","chopped"],[2,"tbsp","unsalted butter"],[3,"","egg","separated, room temperature"],[0.25,"cup","granulated sugar","divided"],[1,"cup","heavy cream","cold"],[1,"tsp","vanilla extract"],[0.125,"tsp","salt"]], st:["Melt the chocolate and butter in a heatproof bowl set over barely simmering water, stirring until smooth. Cool 5 minutes, then whisk in the egg yolks one at a time.","Beat the egg whites with the salt to soft peaks, then gradually beat in 2 tbsp sugar until glossy and stiff.","In another bowl, whip the cream with the remaining sugar and the vanilla to soft peaks.","Fold one-third of the whites into the chocolate to lighten it, then gently fold in the remaining whites, followed by the whipped cream, until no streaks remain.","Spoon into 6 glasses or ramekins and chill at least 3 hours until set."]},

// ---------- Formatting ----------
const FRACS = [[0, ""], [1/8, "⅛"], [1/4, "¼"], [1/3, "⅓"], [3/8, "⅜"], [1/2, "½"], [5/8, "⅝"], [2/3, "⅔"], [3/4, "¾"], [7/8, "⅞"], [1, ""]];
const COARSE = FRACS.filter(f => !/[⅛⅜⅝⅞]/.test(f[1]));
function frac(x, coarse) {
  let whole = Math.floor(x + 1e-9), r = x - whole, best = FRACS[0], bd = 9;
  for (const f of (coarse ? COARSE : FRACS)) { const d = Math.abs(f[0] - r); if (d < bd) { bd = d; best = f; } }
  if (best[0] === 1) { whole += 1; best = FRACS[0]; }
  if (whole === 0 && !best[1]) return "⅛";
  return (whole ? String(whole) : "") + best[1];
}
const UNIT_PL = { cup: "cups", clove: "cloves", stalk: "stalks", head: "heads", can: "cans", pkg: "pkgs", sprig: "sprigs", slice: "slices", pint: "pints", stick: "sticks" };
function unitLabel(u, q) { if (!u) return ""; return q > 1 + 1e-9 ? (UNIT_PL[u] || u) : u; }
function pluralWord(w) {
  if (/leaf$/.test(w)) return w.replace(/leaf$/, "leaves");
  if (w === "zucchini") return w;
  if (/[^ñ]o$/.test(w)) return w + "es";
  if (/[^s]s$/.test(w)) return w;
  if (/(ss|sh|ch|x)$/.test(w)) return w + "es";
  return w + "s";
}
function pluralName(name) {
  const i = name.indexOf(" (");
  const head = i >= 0 ? name.slice(0, i) : name, tail = i >= 0 ? name.slice(i) : "";
  const parts = head.split(" ");
  parts[parts.length - 1] = pluralWord(parts[parts.length - 1]);
  return parts.join(" ") + tail;
}
function displayName(name, unit, qty) { return !unit && qty > 1 + 1e-9 ? pluralName(name) : name; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

// ---------- Unit math for the shopping list ----------
const VOL = { tsp: 1, tbsp: 3, cup: 48 };
const WT = { oz: 1, lb: 16 };
function groupOf(u) { return VOL[u] ? "vol" : WT[u] ? "wt" : "u:" + u; }
function toBase(q, u) { return VOL[u] ? q * VOL[u] : WT[u] ? q * WT[u] : q; }
function fmtAmount(group, base, name) {
  if (group === "vol") {
    if (name === "unsalted butter") { const sticks = base / 24; return frac(sticks) + " " + unitLabel("stick", sticks); }
    if (base >= 12) { const c = base / 48; return frac(c, true) + " " + unitLabel("cup", Math.round(c * 4) / 4); }
    if (base >= 3) return frac(base / 3) + " tbsp";
    return frac(base) + " tsp";
  }
  if (group === "wt") return base >= 16 ? frac(base / 16) + " lb" : frac(base) + " oz";
  const u = group.slice(2);
  base = Math.ceil(base - 1e-9); // buy whole items
  return frac(base) + (u ? " " + unitLabel(u, base) : "");
}

function buildList() {
  const items = {};
  for (const id of selected) {
    const r = BY_ID[id];
    for (const [q, u, name] of r.i) {
      const it = items[name] || (items[name] = { name, aisle: AISLE_OF[name] || "Z", groups: {}, toTaste: false, from: new Set() });
      it.from.add(r.n);
      if (q == null) { it.toTaste = true; continue; }
      const g = groupOf(u);
      it.groups[g] = (it.groups[g] || 0) + toBase(q, u);
    }
  }
  const out = Object.values(items).map(it => {
    const gs = Object.entries(it.groups);
    const amount = gs.map(([g, b]) => fmtAmount(g, b, it.name)).join(" + ");
    let countish = 1;
    if (gs.length === 1 && gs[0][0] === "u:") countish = Math.ceil(gs[0][1] - 1e-9);
    return {
      name: it.name,
      label: gs.length === 1 && gs[0][0] === "u:" ? displayName(it.name, "", countish) : it.name,
      amount: amount || "to taste",
      aisle: it.aisle,
      staple: STAPLES.has(it.name),
      from: [...it.from]
    };
  });
  const order = AISLES.map(a => a[0]);
  out.sort((a, b) => order.indexOf(a.aisle) - order.indexOf(b.aisle) || a.name.localeCompare(b.name));
  return out;
}

// ---------- Sections (store order) with write-in blanks ----------
const SECTION_ORDER = ["P", "M", "D", "B", "G", "C", "K", "S", "O", "Z", "F", "X"];
const BLANKS = 3, OTHER_BLANKS = 10;
let extras = store.get("extras", {});
function sections(items) {
  return SECTION_ORDER.map(a => {
    const its = items.filter(i => i.aisle === a);
    const other = a === "Z";
    return { a, label: other ? "Other Items" : AISLE_NAME[a], its, blanks: other ? OTHER_BLANKS : BLANKS };
  }).filter(s => s.its.length || s.a === "Z");
}
function extraFor(a, n) { return extras[a + ":" + n] || { text: "", done: false }; }
function saveExtra(key, patch) {
  extras[key] = Object.assign({ text: "", done: false }, extras[key], patch);
  if (!extras[key].text && !extras[key].done) delete extras[key];
  store.set("extras", extras);
}

function listText() {
  const items = buildList();

    t += `\n${label.toUpperCase()}\n` + its.map(i => `${gotIt.has(i.name) ? "[x]" : "[ ]"} ${i.amount} ${i.label}`)
      .concat(ex.map(e => `${e.done ? "[x]" : "[ ]"} ${e.text.trim()}`)).join("\n") + "\n";
  }

}

// ---------- Printable PDF ----------
const ASCII_FRAC = { "⅛": "1/8", "¼": "1/4", "⅓": "1/3", "⅜": "3/8", "½": "1/2", "⅝": "5/8", "⅔": "2/3", "¾": "3/4", "⅞": "7/8" };
function pdfSafe(t) {
  return t.replace(/(\d?)([⅛¼⅓⅜½⅝⅔¾⅞])/g, (m, d, f) => (d ? d + " " : "") + ASCII_FRAC[f])
          .replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/[^\x00-\xFF]/g, "");
}
function weekLabel(now = new Date()) {
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const dow = d.getDay(); // Sun 0 ... Sat 6; on a weekend, plan for the coming week
  const mon = new Date(d); mon.setDate(d.getDate() + (dow === 0 ? 1 : dow === 6 ? 2 : 1 - dow));
  const fri = new Date(mon); fri.setDate(mon.getDate() + 4);
  const f = x => x.toLocaleDateString("en-US", { month: "long", day: "numeric" });
  return `Week of Monday, ${f(mon)} - Friday, ${f(fri)}`;
}
function makePdf() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "letter" });
  const W = 612, H = 792, M = 42, GAP = 24, COLW = (W - 2 * M - GAP) / 2;
  const items = buildList();
  const sel = ORDERED.filter(r => selected.has(r.id));
  doc.setFont("helvetica", "bold"); doc.setFontSize(20); doc.setTextColor(21, 33, 58);
  doc.text("Dinner Menu", M, M + 16);
  doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor(31, 79, 163); doc.text("STOCKPOT", W - M, M + 16, { align: "right" });
  doc.setFont("helvetica", "bold"); doc.setFontSize(20); doc.setTextColor(21, 33, 58);
  doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(89, 101, 127);
  doc.text(weekLabel(), M, M + 32);
  doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor(31, 79, 163);
  doc.text("Meals this week", M, M + 52);
  doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(21, 33, 58);
  const mCols = sel.length > 8 ? 3 : sel.length > 3 ? 2 : 1;
  const mColW = (W - 2 * M) / mCols, perCol = Math.ceil(sel.length / mCols);
  sel.forEach((r, i) => {
    const cx = M + Math.floor(i / perCol) * mColW, cy = M + 66 + (i % perCol) * 12;
    doc.setFillColor(31, 79, 163); doc.circle(cx + 3, cy - 3, 1.5, "F");
    doc.text(doc.splitTextToSize(pdfSafe(r.n), mColW - 16)[0], cx + 10, cy);
  });
  let top = M + 66 + (perCol - 1) * 12 + 12;
  doc.setDrawColor(31, 79, 163); doc.setLineWidth(1.2); doc.line(M, top, W - M, top);
  top += 18;
  let col = 0, y = top;
  const x = () => M + col * (COLW + GAP);
  const need = h => { if (y + h > H - M) { if (col === 0) { col = 1; y = top; } else { doc.addPage(); col = 0; top = M; y = top; } } };
  const box = (checked) => {
    doc.setDrawColor(89, 101, 127); doc.setLineWidth(0.7); doc.rect(x() + 2, y - 7.5, 8.5, 8.5);
    if (checked) { doc.line(x() + 3, y - 3.5, x() + 5.5, y - 0.5); doc.line(x() + 5.5, y - 0.5, x() + 9.5, y - 7); }
  };
  for (const { a, label, its: allIts, blanks } of sections(items)) {
    const its = allIts.filter(i => !gotIt.has(i.name)); // crossed-off items stay off the printout
    if (allIts.length && !its.length) continue;
    need(30 + Math.min(its.length, 2) * 11);
    doc.setFillColor(231, 237, 247); doc.rect(x(), y - 10, COLW, 15, "F");
    doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(31, 79, 163);
    doc.text(pdfSafe(label.toUpperCase()), x() + 5, y + 0.5);
    y += 16;
    doc.setFont("helvetica", "normal"); doc.setFontSize(8.5);
    for (const it of its) {
      const text = pdfSafe(`${it.amount}  ${it.label}${it.staple ? "  (pantry)" : ""}`);
      const lines = doc.splitTextToSize(text, COLW - 20);
      const h = lines.length * 10.5 + 3;
      need(h);
      box(false);
      doc.setTextColor(21, 33, 58);
      doc.text(lines, x() + 17, y);
      y += h;
    }
    for (let n = 0; n < blanks; n++) {
      need(14);
      const ex = extraFor(a, n);
      box(false);
      doc.setDrawColor(210, 218, 231); doc.setLineWidth(0.5); doc.line(x() + 17, y + 1.5, x() + COLW - 4, y + 1.5);
      if (ex.text.trim() && !ex.done) { doc.setTextColor(21, 33, 58); doc.text(doc.splitTextToSize(pdfSafe(ex.text.trim()), COLW - 22)[0], x() + 17, y); }
      y += 14;
    }
    y += 8;
  }
  drawRecipeCards(doc, sel, { W, H, M });
  return doc;
}
function ingText([q, u, name]) {
  const qty = q == null ? "" : frac(q) + (u ? " " + unitLabel(u, q) : "") + " ";
  return qty + displayName(name, u, q || 0) + (q == null ? " (to taste)" : "");
}
// Recipe snapshots: same card format, each card as tall as its recipe needs, packed onto pages
function drawRecipeCards(doc, recipes, { W, H, M }) {
  if (!recipes.length) return;
  const HEAD = 22, LH = 8.4, GAP_AFTER = 10;
  const ingW = (W - 2 * M) * 0.42, stepX = M + ingW + 14, stepW = W - M - stepX, colW = (ingW - 8) / 2;
  const startPage = doc.getNumberOfPages() + 1;
  const newPage = () => {
    doc.addPage();
    doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.setTextColor(21, 33, 58);
    doc.text("Recipes this week", M, M + 10);
    return M + HEAD;
  };
  let y0 = newPage(), firstOnPage = true;
  for (const r of recipes) {
    doc.setFont("helvetica", "normal"); doc.setFontSize(7);
    // Ingredients: two columns, each ingredient's wrapped lines kept together, columns balanced
    const blocks = r.i.map(ing => doc.splitTextToSize(pdfSafe(ingText(ing)), colW - 2).map((l, k) => (k ? "   " : "") + l));
    const total = blocks.reduce((n, b) => n + b.length, 0);
    const cols = [[], []]; let c = 0;
    for (const bl of blocks) { if (c === 0 && cols[0].length >= Math.ceil(total / 2)) c = 1; cols[c].push(...bl); }
    const stepLines = r.st.flatMap((st, k) => doc.splitTextToSize(pdfSafe(st), stepW - 12).map((l, j) => [j ? "" : `${k + 1}.`, l]));
    const bodyLines = Math.max(cols[0].length, cols[1].length, stepLines.length);
    const cardH = 25 + 9 + bodyLines * LH + GAP_AFTER;
    if (!firstOnPage && y0 + cardH > H - M) { y0 = newPage(); firstOnPage = true; }
    // Divider + title + meta
    doc.setDrawColor(31, 79, 163); doc.setLineWidth(firstOnPage ? 1.2 : 0.5); doc.line(M, y0, W - M, y0);
    let y = y0 + 14;
    doc.setFont("helvetica", "bold"); doc.setFontSize(10.5); doc.setTextColor(21, 33, 58);
    const title = pdfSafe(r.n);
    doc.text(title, M, y);
    const tw = doc.getTextWidth(title);
    doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor(89, 101, 127);
    doc.text(pdfSafe(`${CAT_NAME[r.c]}${r.sub ? " - " + subLabel(r) : ""}  ·  Serves ${r.s}  ·  ${r.t}`), M + tw + 8, y);
    y += 11;
    doc.setFont("helvetica", "bold"); doc.setFontSize(7); doc.setTextColor(31, 79, 163);
    doc.text("INGREDIENTS", M, y); doc.text("INSTRUCTIONS", stepX, y);
    const bodyTop = y + 9;
    doc.setFont("helvetica", "normal"); doc.setFontSize(7); doc.setTextColor(21, 33, 58);
    // A very long recipe may spill onto the next page; continue its lines there
    let pageOffset = 0;
    const lineY = k => {
      let yy = bodyTop + k * LH - pageOffset;
      return yy;
    };
    const rows = bodyLines;
    for (let k = 0; k < rows; k++) {
      let yy = lineY(k);
      if (yy > H - M) { newPage(); pageOffset += yy - (M + HEAD + 8); yy = lineY(k); }
      if (cols[0][k]) doc.text(cols[0][k], M, yy);
      if (cols[1][k]) doc.text(cols[1][k], M + colW + 8, yy);
      if (stepLines[k]) {
        const [num, l] = stepLines[k];
        if (num) { doc.setFont("helvetica", "bold"); doc.text(num, stepX, yy); doc.setFont("helvetica", "normal"); }
        doc.text(l, stepX + 12, yy);
      }
    }
    y0 = lineY(rows - 1) + GAP_AFTER + 4;
    firstOnPage = false;
  }
  // Page numbers for the recipe section
  const last = doc.getNumberOfPages(), n = last - startPage + 1;
  for (let p = startPage; p <= last; p++) {
    doc.setPage(p);
    doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(89, 101, 127);
    doc.text(`Page ${p - startPage + 1} of ${n}`, W - M, M + 10, { align: "right" });
  }
}
let downloadsNs;

  if (action) {
    const b = document.createElement("button"); b.type = "button"; b.className = "toast-act"; b.textContent = action.label;

$("closeMenu").addEventListener("click", () => $("app").classList.remove("menu-open"));
document.addEventListener("input", e => {
  const w = e.target.closest("[data-ex]");
  if (w) saveExtra(w.dataset.ex, { text: w.value });
});
$("search").addEventListener("input", e => { query = e.target.value.trim(); renderToc(); });

// ---------- Resizable sidebar ----------
(() => {
  const MIN = 260, MAX = 640, DEF = 380;
  const root = document.documentElement, rz = $("resizer");
  const setW = w => { w = Math.round(Math.max(MIN, Math.min(MAX, w, window.innerWidth - 360))); root.style.setProperty("--rail", w + "px"); rz.setAttribute("aria-valuenow", w); return w; };
  const saved = store.get("railW", null);
  if (saved) setW(saved);
  rz.setAttribute("aria-valuemin", MIN); rz.setAttribute("aria-valuemax", MAX);
  let startX, startW;
  rz.addEventListener("pointerdown", e => {
    startX = e.clientX; startW = document.querySelector(".rail").getBoundingClientRect().width;
    rz.setPointerCapture(e.pointerId); document.body.classList.add("resizing"); e.preventDefault();
  });
  rz.addEventListener("pointermove", e => { if (startX != null) setW(startW + e.clientX - startX); });
  const end = () => { if (startX == null) return; startX = null; document.body.classList.remove("resizing"); store.set("railW", parseInt(getComputedStyle(root).getPropertyValue("--rail"))); };
  rz.addEventListener("pointerup", end); rz.addEventListener("pointercancel", end);
  rz.addEventListener("dblclick", () => { setW(DEF); store.set("railW", null); });
  rz.addEventListener("keydown", e => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    const cur = parseInt(getComputedStyle(root).getPropertyValue("--rail"));
    store.set("railW", setW(cur + (e.key === "ArrowRight" ? 20 : -20))); e.preventDefault();
  });
})();

route();
</script>
</body>
</html>
