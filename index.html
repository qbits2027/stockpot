<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="Stockpot: a weekly dinner planner with 199 recipes and a combined, aisle-sorted shopping list.">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Stockpot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: enamelware kitchen — cobalt enamel with a navy rim; outlined panels hold each part of the plan (contents, recipe card, market list by aisle) */
:root {
  --bg: #F2F5FA;
  --surface: #FFFFFF;
  --surface-2: #E7EDF7;
  --ink: #15213A;
  --muted: #59657F;
  --line: #D2DAE7;
  --rim: #22345C;
  --accent: #1F4FA3;
  --accent-soft: #E0E9F8;
  --on-accent: #FFFFFF;
  --speck: rgba(255, 255, 255, .22);
  --mark: #D4951A;
  --mark-soft: #FBEFD3;
  --display: "Bricolage Grotesque", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --rail: 380px;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1120; --surface: #141B2D; --surface-2: #1C2539; --ink: #E4E9F3; --muted: #98A3BA;
    --line: #2A3550; --rim: #7F95C6; --accent: #86A9F2; --accent-soft: #1B2948; --on-accent: #0B1322;
    --speck: rgba(11, 19, 34, .25); --mark: #E8B04E; --mark-soft: #3A2E15; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1120; --surface: #141B2D; --surface-2: #1C2539; --ink: #E4E9F3; --muted: #98A3BA;
  --line: #2A3550; --rim: #7F95C6; --accent: #86A9F2; --accent-soft: #1B2948; --on-accent: #0B1322;
  --speck: rgba(11, 19, 34, .25); --mark: #E8B04E; --mark-soft: #3A2E15; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--accent); }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
.badge { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--rim); background: var(--accent-soft); color: var(--accent); flex: none; }
.badge .ic { width: 19px; height: 19px; }
.speckle { background-color: var(--accent); background-image: radial-gradient(var(--speck) 1px, transparent 1.6px), radial-gradient(var(--speck) .8px, transparent 1.3px); background-size: 17px 17px, 11px 11px; background-position: 0 0, 6px 8px; }

.app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); height: 100%; }

/* ---------- Rail ---------- */
.rail { position: relative; display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-right: 1.5px solid var(--rim); }
.rail-head { padding: 18px 18px 12px; display: grid; gap: 12px; border-bottom: 1.5px solid var(--rim); }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand button { background: none; border: 0; padding: 0; text-align: left; display: flex; align-items: center; gap: 10px; }
.brand .logo { width: 40px; height: 40px; border-radius: 11px; border: 1.5px solid var(--rim); color: var(--on-accent); display: grid; place-items: center; }
.brand .logo .ic { width: 24px; height: 24px; stroke-width: 1.7; }
.brand h1 { font-size: 25px; line-height: 1; font-weight: 800; letter-spacing: -0.02em; }
.brand small { display: block; color: var(--muted); font-size: 12px; font-family: var(--body); margin-top: 3px; }
.search { width: 100%; padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font: inherit; }
.search:focus { border-color: var(--accent); outline: none; }
.search::placeholder { color: var(--muted); }
.toc { flex: 1; overflow-y: auto; padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.toc-group { flex: none; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.toc-group.open { border-color: var(--rim); }
.toc-cat { width: 100%; background: none; border: 0; padding: 8px 12px 8px 10px; display: grid; grid-template-columns: 14px 30px minmax(0,1fr) auto; gap: 8px; align-items: center; text-align: left; }
.toc-cat .badge { width: 30px; height: 30px; }
.toc-cat .badge .ic { width: 17px; height: 17px; }
.toc-cat:hover { background: var(--surface-2); }
.toc-group.open .toc-cat { border-bottom: 1px solid var(--line); background: var(--surface-2); }
.toc-cat .eyebrow { color: var(--ink); font-size: 12.5px; }
.chev { width: 7px; height: 7px; border-right: 1.7px solid var(--muted); border-bottom: 1.7px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; justify-self: center; }
.toc-cat[aria-expanded="true"] .chev { transform: rotate(45deg); }
.cat-meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; gap: 8px; align-items: center; }
.cat-sel { background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 0 7px; font-weight: 700; font-size: 11px; }
.star { background: none; border: 0; padding: 4px 0; font-size: 17px; line-height: 1; color: var(--muted); opacity: .45; }
.toc-row:hover .star, .star:focus-visible { opacity: 1; }
.star.on { color: var(--mark); opacity: 1; }
.fav-filter { margin-left: auto; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; display: inline-flex; gap: 6px; align-items: center; }
.fav-filter span { color: var(--muted); font-variant-numeric: tabular-nums; }
.fav-filter.on { background: var(--mark-soft); border-color: var(--mark); }
.fav-filter.on, .fav-filter.on span { color: var(--ink); }
.fav-btn { border: 1.5px solid var(--rim); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 14px; font-weight: 700; margin-left: auto; }
.fav-btn.on { border-color: var(--mark); background: var(--mark-soft); }
.fav-btn + .toggle-list { margin-left: 0; }
.c-star { color: var(--mark); }
@media (max-width: 860px) { .fav-btn { margin-left: 0; } }
.toc-sub { display: flex; justify-content: space-between; padding: 8px 12px 3px 40px; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); border-top: 1px dashed var(--line); }
.toc-cat + .toc-sub { border-top: 0; }
.toc-sub span { font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.toc-tools { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
.toc-row { display: grid; grid-template-columns: 20px minmax(0,1fr) auto 24px; align-items: center; gap: 8px; padding: 0 10px 0 14px; }
.toc-row + .toc-row { border-top: 1px solid var(--surface-2); }
.toc-row:hover { background: var(--surface-2); }
.toc-row.active { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.toc-row.active .toc-name { color: var(--accent); font-weight: 700; }
.toc-row input { width: 17px; height: 17px; accent-color: var(--accent); margin: 0; cursor: pointer; }
.toc-name { background: none; border: 0; text-align: left; padding: 7px 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14.5px; }
.toc-time { font-size: 12px; color: var(--muted); white-space: nowrap; }
.toc-empty { padding: 20px 10px; color: var(--muted); }
.rail-foot { padding: 12px 14px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1.5px solid var(--rim); display: grid; gap: 8px; background: var(--surface); }
.btn-primary { width: 100%; border: 1.5px solid var(--rim); border-radius: 12px; padding: 12px 14px; background: var(--accent); color: var(--on-accent); font-weight: 700; display: flex; justify-content: center; align-items: center; gap: 10px; }
.btn-primary .ic { width: 20px; height: 20px; }
.btn-primary:disabled { opacity: .45; cursor: not-allowed; }
.count { background: var(--on-accent); color: var(--accent); border-radius: 999px; min-width: 24px; padding: 1px 7px; font-size: 13px; font-variant-numeric: tabular-nums; }
.foot-meta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; font-size: 13px; }
.uncheck-btn { border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 3px 10px; font-size: 12.5px; font-weight: 700; }
.uncheck-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.uncheck-btn:disabled { color: var(--muted); opacity: .55; cursor: default; }
.toast-act { margin-left: 14px; background: none; border: 0; padding: 0; color: var(--mark); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.link-btn:disabled { color: var(--muted); opacity: .6; cursor: default; }

/* ---------- Main ---------- */
.main { overflow-y: auto; min-width: 0; }
.mobile-bar { display: none; }
.page { max-width: 960px; margin: 0 auto; padding-block: 32px 64px; padding-inline: 40px; }
.panel { background: var(--surface); border: 1.5px solid var(--rim); border-radius: var(--radius); }

/* Home / contents */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: center; padding: 28px 30px; border-radius: var(--radius); border: 1.5px solid var(--rim); color: var(--on-accent); margin-bottom: 18px; }
.hero h2 { font-size: clamp(30px, 4.4vw, 46px); line-height: 1.02; font-weight: 800; letter-spacing: -0.025em; }
.hero p { margin: 10px 0 0; max-width: 52ch; opacity: .92; }
.hero .eyebrow { color: var(--on-accent); opacity: .85; }
.hero-art { width: 132px; height: 132px; border-radius: 50%; border: 2px solid var(--on-accent); display: grid; place-items: center; background: color-mix(in srgb, var(--on-accent) 12%, transparent); }
.hero-art .ic { width: 78px; height: 78px; stroke-width: 1.25; }
.how { padding: 0; margin-top: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 30px; }
.how li { list-style: none; display: grid; grid-template-columns: auto minmax(0,1fr); gap: 12px; align-items: start; padding: 14px 16px; }
.how b { display: block; font-family: var(--display); font-size: 16px; }
.how span { color: var(--muted); font-size: 13.5px; line-height: 1.45; }
.how ol { display: contents; }
.step-no { font-family: var(--display); font-weight: 800; font-size: 13px; color: var(--accent); letter-spacing: .04em; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 14px; }
.section-title h2 { font-size: 24px; }
.section-title span { color: var(--muted); font-size: 13px; }
.contents { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.contents section { display: grid; gap: 4px; align-content: start; padding: 14px 16px 12px; }
.contents h3 { font-size: 19px; padding-bottom: 10px; margin-bottom: 4px; border-bottom: 1.5px solid var(--rim); display: flex; gap: 10px; align-items: center; }
.contents h3 small { margin-left: auto; white-space: nowrap; font-family: var(--body); font-weight: 500; font-size: 12px; color: var(--muted); }
.contents ol { list-style: none; margin: 0; padding: 0; }
.contents li button { background: none; border: 0; padding: 5px 0; width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dotted var(--line); font-size: 14px; }
.contents li:last-child button { border-bottom: 0; }
.contents li button:hover .c-name { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.contents .c-time { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.contents li.c-sub { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); padding: 10px 0 2px; }
.contents li.c-sub:first-child { padding-top: 2px; }

/* Recipe card */
.recipe-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 18px; padding: 24px 26px; }
.recipe-head > .badge { width: 58px; height: 58px; grid-row: span 3; }
.recipe-head > .badge .ic { width: 30px; height: 30px; stroke-width: 1.5; }
.recipe-head h2 { font-size: clamp(30px, 4.5vw, 44px); line-height: 1.05; font-weight: 800; letter-spacing: -0.02em; }
.recipe-head p { margin: 0; color: var(--muted); font-size: 16.5px; max-width: 62ch; }
.recipe-bar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; padding-top: 16px; border-top: 1px dashed var(--line); }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0; }
.meta div { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 12px 6px 10px; background: var(--bg); }
.meta div .ic { color: var(--accent); }
.meta dt { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.meta dd { margin: 0; font-weight: 700; font-size: 14px; line-height: 1.2; }
.meta div > span { display: grid; }
.toggle-list { margin-left: auto; border: 1.5px solid var(--rim); color: var(--accent); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
.toggle-list.on { background: var(--accent); color: var(--on-accent); }
.recipe-body { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 18px; padding-top: 18px; align-items: start; }
.recipe-body section { padding: 18px 20px 20px; }
.recipe-body h3 { font-size: 20px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1.5px solid var(--rim); display: flex; align-items: center; gap: 10px; }
.recipe-body h3 .ic { color: var(--accent); width: 20px; height: 20px; }
.recipe-body h3 small { margin-left: auto; font-family: var(--body); font-weight: 500; font-size: 12px; color: var(--muted); }
.ing-list { list-style: none; margin: 0; padding: 0; }
.ing-list li { display: grid; grid-template-columns: 84px minmax(0,1fr); gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--surface-2); font-size: 14.5px; }
.ing-list li:last-child { border-bottom: 0; }
.ing-qty { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); }
.ing-note { color: var(--muted); }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: step; display: grid; gap: 14px; }
.steps li { counter-increment: step; display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 12px; }
.steps li::before { content: counter(step); font-family: var(--display); font-weight: 800; font-size: 15px; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--rim); background: var(--accent-soft); display: grid; place-items: center; color: var(--accent); }
.steps li p { margin: 3px 0 0; max-width: 64ch; }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; }
.pager button { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 14px; text-align: left; display: grid; color: var(--ink); max-width: 48%; }
.pager button:hover { border-color: var(--rim); }
.pager button:last-child { text-align: right; margin-left: auto; }
.pager small { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.pager span { font-family: var(--display); font-weight: 700; font-size: 16px; }

/* Shopping list */
.list-head { display: grid; gap: 12px; margin-bottom: 18px; padding: 22px 24px; }
.list-head h2 { font-size: clamp(28px, 4vw, 40px); font-weight: 800; display: flex; align-items: center; gap: 12px; }
.list-head h2 .badge { width: 44px; height: 44px; }
.list-head h2 .badge .ic { width: 24px; height: 24px; }
.list-sub { color: var(--muted); margin: 0; font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--bg); border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 13px; font-weight: 600; }
.chip button { background: var(--surface-2); border: 0; border-radius: 50%; width: 20px; height: 20px; line-height: 1; padding: 0; color: var(--muted); }
.list-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn-print { border: 1.5px solid var(--rim); background: var(--accent); color: var(--on-accent); border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
.btn-ghost { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: 14px; }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.progress { height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.aisles { columns: 2 300px; column-gap: 16px; }
.aisle { break-inside: avoid; background: var(--surface); border: 1.5px solid var(--rim); border-radius: 12px; margin: 0 0 16px; overflow: hidden; }
.aisle-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--surface-2); border-bottom: 1.5px solid var(--rim); }
.aisle-head .badge { width: 28px; height: 28px; background: var(--surface); }
.aisle-head .badge .ic { width: 16px; height: 16px; }
.aisle-head h3 { font-size: 15px; }
.aisle-head > span:last-child { margin-left: auto; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.aisle ul { list-style: none; margin: 0; padding: 2px 0; }
.aisle li + li .item { border-top: 1px solid var(--surface-2); }
.item { display: grid; grid-template-columns: 16px minmax(0,1fr); gap: 9px; padding: 5px 12px; cursor: pointer; align-items: start; font-size: 13px; line-height: 1.4; }
.item input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--accent); margin: 2px 0 0; cursor: pointer; }
.item-main { display: grid; gap: 0; min-width: 0; }
.item-line { display: flex; gap: 6px; flex-wrap: wrap; }
.item-qty { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); }
.item-for { font-size: 11px; color: var(--muted); }
.item.done .item-line, .item.done .write-in { text-decoration: line-through; color: var(--muted); }
.item.done .item-qty { color: var(--muted); }
.item.blank { align-items: center; cursor: default; }
.write-in { width: 100%; min-width: 0; border: 0; border-bottom: 1px dashed var(--line); background: transparent; color: var(--ink); font: inherit; font-size: 13px; padding: 1px 0; }
.write-in::placeholder { color: var(--muted); opacity: .7; }
.write-in:focus { outline: none; border-bottom-color: var(--accent); }
.tag-staple { font-size: 10px; font-weight: 700; background: var(--mark-soft); color: var(--ink); border: 1px solid var(--mark); border-radius: 4px; padding: 0 5px; align-self: center; }
.empty { background: var(--surface); border: 1.5px dashed var(--rim); border-radius: var(--radius); padding: 28px; color: var(--muted); display: flex; gap: 16px; align-items: center; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; z-index: 50; }
.copy-fallback { width: 100%; min-height: 200px; margin-top: 12px; font: 13px/1.5 ui-monospace, Menlo, monospace; background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px; }

/* ---------- Narrow screens ---------- */
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; inset: 0; z-index: 30; transform: translateX(-100%); transition: transform .22s ease; padding-top: env(safe-area-inset-top, 0px); border-right: 0; }
  .app.menu-open .rail { transform: none; }
  .brand .rail-close { display: inline-flex !important; }
  .mobile-bar { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); border-bottom: 1.5px solid var(--rim); padding: 10px 16px; gap: 10px; align-items: center; justify-content: space-between; }
  .mobile-bar .title { font-family: var(--display); font-weight: 800; font-size: 19px; display: flex; align-items: center; gap: 6px; }
  .mobile-bar .title .ic { color: var(--accent); width: 20px; height: 20px; }
  .page { padding-inline: 16px; padding-block: 18px 48px; }
  .recipe-body { grid-template-columns: minmax(0, 1fr); }
  .toggle-list { margin-left: 0; }
  .hero { grid-template-columns: minmax(0, 1fr); padding: 22px 20px; }
  .hero-art { display: none; }

{ id: "minestrone", n: "Minestrone", c: "soups", s: "6", t: "50 min",

  i: [[2, "tbsp", "olive oil"], [1, "", "yellow onion", "diced"], [2, "", "carrot", "diced"], [2, "stalk", "celery", "diced"], [3, "clove", "garlic", "minced"], [1, "", "zucchini", "diced"], [1, "can", "diced tomatoes (14.5 oz)"], [6, "cup", "vegetable broth"], [1, "can", "cannellini beans (15 oz)", "drained and rinsed"], [1, "tsp", "dried oregano"], [1, "tsp", "dried basil"], [1, "cup", "ditalini pasta"], [2, "cup", "baby spinach"], [0.25, "cup", "grated parmesan cheese"], [null, "", "salt"], [null, "", "black pepper"]],
  st: ["Heat the oil in a large pot over medium heat. Cook the onion, carrots and celery 8 minutes.", "Add the garlic and zucchini and cook 3 minutes.", "Add the tomatoes, broth, beans, oregano and basil. Bring to a boil, then simmer 15 minutes.", "Stir in the pasta and cook 8 to 10 minutes until tender.", "Stir in the spinach until wilted. Season with salt and pepper.", "Serve topped with parmesan."] },

{ id: "french-onion-soup", n: "French Onion Soup", c: "soups", s: "4", t: "1 hr 30 min",
  d: "Deeply caramelized onions in rich broth under a lid of toasted bread and melted Gruyère.",
  i: [[4, "tbsp", "unsalted butter"], [4, "", "yellow onion", "large, thinly sliced"], [1, "tsp", "granulated sugar"], [2, "clove", "garlic", "minced"], [0.5, "cup", "dry white wine"], [6, "cup", "beef broth"], [0.5, "tsp", "dried thyme"], [1, "", "bay leaf"], [1, "", "baguette", "sliced and toasted"], [1.5, "cup", "shredded Gruyère cheese"], [null, "", "salt"], [null, "", "black pepper"]],
  st: ["Melt the butter in a large heavy pot over medium heat. Add the onions, sugar and a pinch of salt.", "Cook, stirring every few minutes, 45 to 60 minutes until the onions are deep golden brown. Lower the heat if they start to scorch.", "Add the garlic and cook 1 minute. Pour in the wine and scrape up the browned bits.", "Add the broth, thyme and bay leaf. Simmer 20 minutes. Season with salt and pepper and discard the bay leaf.", "Heat the broiler. Ladle the soup into oven-safe bowls, top each with toasted baguette slices and a heap of Gruyère.", "Broil 2 to 4 minutes until the cheese is bubbling and browned."] },

{ id: "caesar-salad", n: "Caesar Salad", c: "soups", s: "4", t: "20 min",
  d: "Crisp romaine with a garlicky, anchovy-rich dressing, croutons and parmesan.",

{ id: "greek-salad", n: "Greek Salad", c: "soups", s: "4", t: "15 min",
  d: "Chunky cucumber, tomato, pepper and olive salad with feta and oregano vinaigrette.",
  i: [[1, "", "English cucumber", "chopped"], [1, "pint", "cherry tomatoes", "halved"], [1, "", "green bell pepper", "chopped"], [0.5, "", "red onion", "thinly sliced"], [0.5, "cup", "kalamata olives"], [1, "cup", "crumbled feta cheese"], [0.25, "cup", "olive oil"], [2, "tbsp", "red wine vinegar"], [1, "tsp", "dried oregano"], [null, "", "salt"], [null, "", "black pepper"]],
  st: ["Combine the cucumber, tomatoes, bell pepper, red onion and olives in a large bowl.", "Whisk the olive oil, vinegar and oregano with a pinch of salt and pepper.", "Pour the dressing over the vegetables and toss.", "Top with the feta and serve."] },

// ---------- CHICKEN ----------
{ id: "roast-chicken", n: "Lemon Herb Roast Chicken", c: "chicken", s: "4", t: "1 hr 45 min",
  d: "Crisp-skinned whole roast chicken with lemon, garlic and thyme.",
  i: [[1, "", "whole chicken (about 4 lb)"], [2, "tbsp", "unsalted butter", "softened"], [1, "tbsp", "olive oil"], [1, "", "lemon", "halved"], [6, "clove", "garlic", "smashed"], [6, "sprig", "fresh thyme"], [1, "", "yellow onion", "cut in wedges"], [1.5, "tsp", "salt"], [0.5, "tsp", "black pepper"]],
  st: ["Heat the oven to 425°F. Pat the chicken very dry with paper towels.", "Rub the butter under and over the skin, then drizzle with oil and season inside and out with salt and pepper.", "Stuff the cavity with the lemon halves, garlic and thyme. Tie the legs together.", "Set the chicken on the onion wedges in a roasting pan or skillet.", "Roast 70 to 90 minutes, until the thickest part of the thigh reads 165°F.", "Rest 15 minutes before carving. Spoon the pan juices over the meat."] },

{ id: "chicken-parmesan", n: "Chicken Parmesan", c: "chicken", s: "4", t: "45 min",
  d: "Crispy breaded cutlets baked with marinara and melted mozzarella, served over spaghetti.",
  i: [[1.5, "lb", "boneless skinless chicken breasts"], [0.5, "cup", "all-purpose flour"], [2, "", "egg"], [1, "cup", "panko breadcrumbs"], [0.5, "cup", "grated parmesan cheese"], [1, "tsp", "Italian seasoning"], [0.5, "cup", "vegetable oil", "for frying"], [2, "cup", "marinara sauce"], [1.5, "cup", "shredded mozzarella cheese"], [2, "tbsp", "fresh basil", "torn"], [8, "oz", "spaghetti"], [null, "", "salt"], [null, "", "black pepper"]],
  st: ["Heat the oven to 425°F. Slice the chicken breasts in half horizontally into thin cutlets and season with salt and pepper.", "Set up three shallow dishes: flour; beaten eggs; panko mixed with parmesan and Italian seasoning.", "Dredge each cutlet in flour, dip in egg, then press into the panko mixture.", "Heat the oil in a large skillet over medium-high heat. Fry the cutlets 2 to 3 minutes per side until golden. Transfer to a baking sheet.", "Spoon marinara over each cutlet and top with mozzarella. Bake 10 to 12 minutes until the cheese is bubbly.", "Meanwhile, cook the spaghetti. Serve the chicken over pasta with extra sauce and basil."] },

{ id: "tikka-masala", n: "Chicken Tikka Masala", c: "chicken", s: "4", t: "50 min",
  d: "Yogurt-marinated chicken in a creamy, gently spiced tomato sauce.",
  i: [[1.5, "lb", "boneless skinless chicken thighs", "cut in chunks"], [0.5, "cup", "plain whole-milk yogurt"], [2, "tbsp", "garam masala", "divided"], [1, "tsp", "ground turmeric"], [1, "tsp", "ground cumin"], [1, "tsp", "salt"], [2, "tbsp", "unsalted butter"], [1, "", "yellow onion", "finely diced"], [4, "clove", "garlic", "minced"], [1, "tbsp", "fresh ginger", "grated"], [0.5, "tsp", "cayenne pepper"], [1, "can", "tomato sauce (15 oz)"], [1, "cup", "heavy cream"], [0.25, "cup", "fresh cilantro", "chopped"], [1.5, "cup", "basmati rice"]],
  st: ["Toss the chicken with the yogurt, 1 tbsp garam masala, turmeric, cumin and salt. Marinate at least 15 minutes (or up to overnight).", "Cook the rice according to the package.", "Melt the butter in a large skillet over medium-high heat. Brown the chicken in batches, about 3 minutes per side. Set aside.", "Lower the heat to medium. Cook the onion 5 minutes, then add the garlic, ginger, cayenne and remaining garam masala for 1 minute.", "Add the tomato sauce and simmer 10 minutes. Stir in the cream and return the chicken.", "Simmer 8 to 10 minutes until the chicken is cooked through. Garnish with cilantro and serve over rice."] },

{ id: "chicken-pot-pie", n: "Chicken Pot Pie", c: "chicken", s: "6", t: "1 hr 15 min",
  d: "Creamy chicken and vegetable filling baked between two flaky crusts.",
  i: [[1, "pkg", "refrigerated pie crusts (2-pack)"], [0.33, "cup", "unsalted butter"], [1, "", "yellow onion", "diced"], [2, "", "carrot", "diced"], [2, "stalk", "celery", "diced"], [0.33, "cup", "all-purpose flour"], [1.75, "cup", "chicken broth"], [0.75, "cup", "whole milk"], [0.5, "tsp", "dried thyme"], [1, "", "rotisserie chicken", "meat shredded (about 3 cups)"], [1, "cup", "frozen peas"], [1, "", "egg", "beaten, for egg wash"], [null, "", "salt"], [null, "", "black pepper"]],
  st: ["Heat the oven to 425°F. Fit one pie crust into a 9-inch pie dish.", "Melt the butter in a large skillet over medium heat. Cook the onion, carrots and celery 8 minutes.", "Sprinkle in the flour and stir 1 minute. Slowly whisk in the broth and milk and simmer until thick, about 3 minutes.", "Stir in the thyme, chicken and peas. Season well with salt and pepper.", "Pour the filling into the crust. Top with the second crust, crimp the edges, cut a few vents, and brush with egg wash.", "Bake 30 to 35 minutes until golden. Rest 10 minutes before slicing."] },

{ id: "chicken-fajitas", n: "Chicken Fajitas", c: "chicken", s: "4", t: "35 min",
  d: "Sizzling lime-and-spice chicken with charred peppers and onions.",
  i: [[1.5, "lb", "boneless skinless chicken breasts", "sliced in strips"], [2, "tbsp", "olive oil"], [1, "", "lime", "juiced"], [2, "tsp", "chili powder"], [1, "tsp", "ground cumin"], [1, "tsp", "smoked paprika"], [0.5, "tsp", "garlic powder"], [1, "tsp", "salt"], [1, "", "red bell pepper", "sliced"], [1, "", "green bell pepper", "sliced"], [1, "", "yellow onion", "sliced"], [8, "", "small flour tortilla"], [0.5, "cup", "sour cream"], [0.5, "cup", "salsa"], [1, "", "avocado", "sliced"], [0.25, "cup", "fresh cilantro"]],

{ id: "chicken-enchiladas", n: "Chicken Enchiladas", c: "chicken", s: "5", t: "50 min",
  d: "Corn tortillas rolled around cheesy chicken and baked in red enchilada sauce.",
  i: [[1, "", "rotisserie chicken", "meat shredded (about 3 cups)"], [1, "can", "red enchilada sauce (19 oz)"], [1, "can", "diced green chiles (4 oz)"], [0.5, "cup", "sour cream"], [1, "tsp", "ground cumin"], [2, "cup", "shredded Mexican-blend cheese", "divided"], [10, "", "corn tortilla"], [2, "", "green onion", "sliced"], [0.25, "cup", "fresh cilantro"]],
  st: ["Heat the oven to 375°F. Spread 1/2 cup enchilada sauce in a 9x13-inch baking dish.", "Mix the chicken, green chiles, sour cream, cumin and 1 cup cheese.", "Warm the tortillas in the microwave under a damp towel so they don't crack.", "Fill each tortilla with about 1/3 cup filling, roll up, and place seam-side down in the dish.", "Pour the remaining sauce over the top and sprinkle with the remaining cheese.", "Bake 20 to 25 minutes until bubbling. Top with green onions and cilantro."] },

{ id: "honey-garlic-chicken", n: "Honey Garlic Chicken Thighs", c: "chicken", s: "4", t: "35 min",
  d: "Pan-seared thighs in a sticky, glossy honey-soy-garlic glaze.",
  i: [[1.5, "lb", "boneless skinless chicken thighs"], [1, "tbsp", "olive oil"], [0.33, "cup", "honey"], [0.25, "cup", "soy sauce"], [5, "clove", "garlic", "minced"], [1, "tbsp", "rice vinegar"], [1, "tsp", "cornstarch"], [2, "", "green onion", "sliced"], [1, "tsp", "sesame seeds"], [null, "", "salt"], [null, "", "black pepper"]],
  st: ["Pat the chicken dry and season lightly with salt and pepper.", "Heat the oil in a large skillet over medium-high heat. Sear the thighs 5 to 6 minutes per side until golden and cooked through (165°F).", "Whisk the honey, soy sauce, garlic, vinegar and cornstarch with 2 tbsp water.", "Lower the heat to medium, pour the sauce into the skillet, and simmer 2 to 3 minutes, turning the chicken until glazed.", "Garnish with green onions and sesame seeds."] },

// ---------- BEEF & PORK ----------
{ id: "beef-chili", n: "Classic Beef Chili", c: "beef-pork", s: "6", t: "1 hr 30 min",
  d: "Thick, well-spiced chili with ground beef and kidney beans.",
  i: [[1, "tbsp", "olive oil"], [2, "lb", "ground beef"], [1, "", "yellow onion", "diced"], [1, "", "green bell pepper", "diced"], [4, "clove", "garlic", "minced"], [3, "tbsp", "chili powder"], [1, "tbsp", "ground cumin"], [1, "tsp", "dried oregano"], [1, "tsp", "smoked paprika"], [1, "tsp", "salt"], [2, "tbsp", "tomato paste"], [1, "can", "crushed tomatoes (28 oz)"], [2, "can", "kidney beans (15 oz)", "drained and rinsed"], [1, "cup", "beef broth"], [1, "cup", "shredded cheddar cheese", "to serve"], [0.5, "cup", "sour cream", "to serve"], [2, "", "green onion", "to serve"]],

{ id: "beef-stew", n: "Beef Stew", c: "beef-pork", s: "6", t: "3 hr",
  d: "Fork-tender beef braised with red wine, potatoes and carrots.",
  i: [[2.5, "lb", "beef chuck roast", "cut in 1.5-inch cubes"], [0.25, "cup", "all-purpose flour"], [2, "tbsp", "olive oil"], [1, "", "yellow onion", "chopped"], [3, "clove", "garlic", "minced"], [2, "tbsp", "tomato paste"], [1, "cup", "dry red wine"], [4, "cup", "beef broth"], [1, "tbsp", "Worcestershire sauce"], [1, "tsp", "dried thyme"], [2, "", "bay leaf"], [1.5, "lb", "Yukon gold potatoes", "cubed"], [4, "", "carrot", "cut in chunks"], [1, "cup", "frozen peas"], [2, "tbsp", "fresh parsley", "chopped"], [null, "", "salt"], [null, "", "black pepper"]],

{ id: "meatloaf", n: "Classic Meatloaf", c: "beef-pork", s: "6", t: "1 hr 20 min",
  d: "Tender, juicy meatloaf with a sweet-tangy ketchup glaze.",

{ id: "beef-tacos", n: "Ground Beef Tacos", c: "beef-pork", s: "4", t: "25 min",

{ id: "beef-broccoli", n: "Beef and Broccoli", c: "beef-pork", s: "4", t: "30 min",
  d: "Takeout-style stir-fry with tender flank steak in a savory brown sauce.",
  i: [[1, "lb", "flank steak", "thinly sliced against the grain"], [2, "tbsp", "cornstarch", "divided"], [0.33, "cup", "soy sauce"], [2, "tbsp", "oyster sauce"], [2, "tbsp", "brown sugar"], [1, "tsp", "toasted sesame oil"], [3, "clove", "garlic", "minced"], [1, "tbsp", "fresh ginger", "grated"], [1, "lb", "broccoli", "cut in florets"], [2, "tbsp", "vegetable oil"], [1.5, "cup", "jasmine rice"]],

{ id: "pulled-pork", n: "Slow Cooker Pulled Pork", c: "beef-pork", s: "8", t: "8 hr",
  d: "Smoky, spice-rubbed pork shoulder cooked low and slow, then tossed with BBQ sauce.",
  i: [[4, "lb", "boneless pork shoulder"], [2, "tbsp", "brown sugar"], [1, "tbsp", "smoked paprika"], [1, "tsp", "garlic powder"], [1, "tsp", "onion powder"], [1, "tsp", "ground cumin"], [2, "tsp", "salt"], [1, "tsp", "black pepper"], [1, "", "yellow onion", "sliced"], [0.5, "cup", "chicken broth"], [0.25, "cup", "apple cider vinegar"], [1, "cup", "BBQ sauce"], [8, "", "brioche bun"]],
  st: ["Mix the brown sugar, paprika, garlic powder, onion powder, cumin, salt and pepper. Rub all over the pork.", "Scatter the onion in the slow cooker and set the pork on top.", "Pour the broth and vinegar around the pork.", "Cover and cook on LOW 8 to 10 hours (or HIGH 5 to 6) until the meat falls apart.", "Shred the pork with two forks, discarding excess fat. Toss with the BBQ sauce and some of the cooking liquid.", "Pile onto toasted buns. Great with Creamy Coleslaw on top."] },

{ id: "pork-chops", n: "Pan-Seared Pork Chops", c: "beef-pork", s: "4", t: "30 min",

  st: ["Pat the chops dry and season generously with salt and pepper. Let sit 15 minutes.", "Heat the oil in a large skillet over medium-high heat. Sear the chops 4 to 5 minutes until deeply browned.", "Flip, then add the butter, garlic and thyme. Tilt the pan and spoon the foaming butter over the chops for 3 to 5 minutes, until 140°F inside.", "Move the chops to a plate and rest 5 minutes.", "Add the broth and Dijon to the pan and simmer 2 minutes, scraping up the browned bits. Spoon over the chops."] },

// ---------- SEAFOOD ----------
{ id: "baked-salmon", n: "Lemon Dill Baked Salmon", c: "seafood", s: "4", t: "25 min",

{ id: "shrimp-scampi", n: "Shrimp Scampi", c: "seafood", s: "4", t: "25 min",
  d: "Garlicky butter-wine shrimp tossed with linguine, lemon and parsley.",

{ id: "fish-tacos", n: "Baja Fish Tacos", c: "seafood", s: "4", t: "35 min",

{ id: "crab-cakes", n: "Maryland Crab Cakes", c: "seafood", s: "4 (8 cakes)", t: "30 min + chill",

{ id: "shrimp-fried-rice", n: "Shrimp Fried Rice", c: "seafood", s: "4", t: "25 min",

  i: [[4, "lb", "boneless pork shoulder", "cut in 2-inch chunks"], [2, "tsp", "salt"], [1, "tsp", "black pepper"], [2, "tsp", "ground cumin"], [2, "tsp", "dried oregano"], [1, "", "orange", "juiced, rind reserved"], [2, "", "lime", "1 juiced, 1 in wedges"], [1, "", "yellow onion", "quartered"], [6, "clove", "garlic", "smashed"], [2, "", "bay leaf"], [2, "tbsp", "vegetable oil"], [16, "", "corn tortilla"], [0.5, "", "white onion", "finely diced"], [0.5, "cup", "fresh cilantro", "chopped"], [0.5, "cup", "salsa"]],
  st: ["Heat the oven to 300°F. Toss the pork with the salt, pepper, cumin and oregano in a Dutch oven.", "Add the orange and lime juice, the squeezed orange rind, the quartered onion, garlic and bay leaves. Add just enough water to come halfway up the pork.", "Bring to a simmer on the stove, cover, and braise in the oven 2 1/2 to 3 hours until the pork falls apart.", "Remove the pork, discard the onion, rind and bay leaves, and shred the meat. Skim the fat from the liquid.", "Heat the oil in a large skillet over medium-high heat. Crisp the pork in batches, 4 to 5 minutes, drizzling with some of the braising liquid.", "Serve in warm tortillas with diced onion, cilantro, salsa and lime wedges."] },

{ id: "philly-cheesesteak", n: "Philly Cheesesteak", c: "beef-pork", s: "4", t: "30 min",

  st: ["Freeze the steak 30 to 45 minutes until firm, then slice it as thinly as possible.", "Heat 1 tbsp oil in a large skillet or griddle over medium heat. Cook the onion with a pinch of salt 10 to 12 minutes until soft and golden. Set aside.", "Butter the rolls and toast them cut-side down until lightly golden.", "Raise the heat to high and add the remaining oil. Cook the steak 2 to 3 minutes, chopping it with a spatula, and season with salt and pepper.", "Mix the onions into the steak, divide into 4 portions in the pan, and top each with 2 slices of provolone. Cover 1 minute until melted.", "Slide a toasted roll over each portion, flip it over with a spatula, and serve hot."] },

  st: ["Soak the potatoes in cold water 30 minutes, then drain and dry very well.", "Heat the oil in a heavy pot to 325°F. Fry the potatoes in batches 5 to 6 minutes until soft but pale. Drain on a rack.", "Raise the oil to 375°F. Whisk 1 cup flour with the baking powder, salt and cayenne, then whisk in the cold beer until just smooth.", "Pat the fish dry, dredge in the remaining flour, dip in the batter, and fry 2 at a time 5 to 6 minutes until deep golden. Drain and sprinkle with salt.", "Return the potatoes to the 375°F oil for 2 to 3 minutes until crisp and golden. Drain and salt.", "Serve the fish and chips with malt vinegar and lemon wedges."] },

  st: ["Bring the broth and milk to a simmer in a saucepan. Slowly whisk in the grits and 1/2 tsp salt.", "Cook on low, stirring often, 20 to 30 minutes until thick and creamy. Stir in 2 tbsp butter and the cheddar and keep warm.", "Cook the bacon in a large skillet over medium heat until crisp, about 6 minutes. Remove, leaving the fat in the pan.", "Toss the shrimp with the paprika, cayenne and a pinch of salt. Cook in the bacon fat over medium-high heat 1 to 2 minutes per side until pink.", "Add the garlic and remaining butter for 30 seconds, then stir in the lemon juice, bacon and green onions.", "Spoon the grits into bowls, top with the shrimp and pan sauce, and sprinkle with parsley."] },

{ id: "seared-scallops", n: "Seared Scallops with Lemon Butter", c: "seafood", s: "4", t: "20 min",

  st: ["Pat the scallops very dry with paper towels and season with salt and pepper.", "Heat the oil in a large skillet over high heat until shimmering. Add the scallops in a single layer without crowding.", "Sear without moving 2 minutes until a deep golden crust forms. Flip, add 1 tbsp butter, and cook 1 to 2 minutes more until just opaque. Transfer to a plate.", "Lower the heat to medium. Add the garlic for 30 seconds, then the wine, and simmer 1 minute, scraping up the browned bits.", "Off the heat, swirl in the remaining butter, lemon zest and juice. Spoon over the scallops and sprinkle with parsley."] },

{ id: "ahi-poke-bowls", n: "Ahi Tuna Poke Bowls", c: "seafood", s: "4", t: "40 min",

  i: [[1.5, "cup", "short-grain sushi rice"], [2, "tbsp", "rice vinegar"], [1, "tsp", "granulated sugar"], [1.25, "lb", "sushi-grade ahi tuna", "cut in 3/4-inch cubes"], [0.25, "cup", "soy sauce"], [1, "tbsp", "toasted sesame oil"], [1, "tsp", "fresh ginger", "grated"], [3, "", "green onion", "thinly sliced"], [0.25, "tsp", "red pepper flakes"], [2, "tsp", "sesame seeds"], [1, "", "avocado", "cubed"], [1, "", "English cucumber", "diced"], [0.25, "cup", "mayonnaise"], [1, "tbsp", "sriracha"]],

{ id: "tiramisu", n: "Tiramisu", c: "desserts", s: "9", t: "6 hr 30 min (incl. chilling)",

  st: ["Heat the oven to 325°F and line a large rimmed sheet pan with parchment.", "Stir the oats, almonds, walnuts, brown sugar, cinnamon and salt together in a large bowl.", "Whisk the maple syrup, olive oil and vanilla, pour over the oat mixture and stir until everything is evenly coated.", "Press the granola into an even layer on the pan and bake 30 to 35 minutes, rotating the pan halfway, until golden brown.", "Cool completely on the pan without stirring, then break into clusters and toss with the cranberries. Store airtight up to 2 weeks."] },

{ id: "sausage-egg-cheese-sandwiches", n: "Sausage Egg and Cheese Breakfast Sandwiches", c: "breakfast", s: "4", t: "25 min",
  d: "Better-than-drive-thru English muffin sandwiches with homemade sausage patties, fried eggs and melty American cheese.",
  i: [[1, "lb", "breakfast sausage", "shaped into 4 thin patties"], [4, "", "English muffin", "split"], [2, "tbsp", "unsalted butter", "divided"], [4, "", "egg"], [4, "slice", "American cheese"], [null, "", "salt"], [null, "", "black pepper"]],
  st: ["Cook the sausage patties in a large skillet over medium heat 4 to 5 minutes per side, until browned and cooked through to 160°F. Keep warm.", "Toast the English muffins and spread with half the butter.", "Melt the remaining butter in a nonstick skillet over medium heat. Crack in the eggs, break the yolks, season with salt and pepper and cook 2 minutes, then flip.", "Top each egg with a slice of cheese, cover and cook 1 minute more until the cheese melts.", "Layer a sausage patty and a cheesy egg on each muffin bottom, cap with the tops and serve warm."] },

// ---------- SOUPS & SALADS ----------
{ id: "split-pea-soup", n: "Split Pea Soup", c: "soups", s: "6", t: "2 hr",
  d: "Thick, hearty split pea soup slowly simmered with a smoky ham hock and vegetables.",
  i: [[2, "tbsp", "unsalted butter"], [1, "", "yellow onion", "diced"], [2, "", "carrot", "diced"], [2, "stalk", "celery", "diced"], [3, "clove", "garlic", "minced"], [1, "lb", "dried green split peas", "rinsed"], [1, "", "smoked ham hock"], [8, "cup", "chicken broth"], [2, "", "bay leaf"], [0.5, "tsp", "dried thyme"], [null, "", "salt"], [null, "", "black pepper"]],
  st: ["Melt the butter in a large pot over medium heat. Cook the onion, carrot and celery 6 to 8 minutes until softened, then add the garlic for 1 minute.", "Add the split peas, ham hock, broth, bay leaves and thyme and bring to a boil.", "Reduce the heat, cover partially and simmer 1.5 hours, stirring occasionally, until the peas have broken down and the soup is thick.", "Remove the ham hock and bay leaves. Pull the meat from the bone, chop it and return it to the pot.", "Thin with water if needed, season with salt and pepper and serve hot."] },

{ id: "lentil-soup", n: "Lentil Soup", c: "soups", s: "6", t: "1 hr",
  d: "Hearty, cumin-scented lentil and vegetable soup brightened with spinach and lemon.",
  i: [[3, "tbsp", "olive oil"], [1, "", "yellow onion", "diced"], [2, "", "carrot", "diced"], [2, "stalk", "celery", "diced"], [4, "clove", "garlic", "minced"], [1, "tsp", "ground cumin"], [0.5, "tsp", "smoked paprika"], [0.5, "tsp", "dried thyme"], [1, "can", "diced tomatoes (14.5 oz)"], [1.5, "cup", "brown lentils", "rinsed"], [6, "cup", "vegetable broth"], [1, "", "bay leaf"], [3, "cup", "baby spinach"], [1, "", "lemon", "juiced"], [null, "", "salt"], [null, "", "black pepper"]],
  st: ["Heat the olive oil in a large pot over medium heat. Cook the onion, carrot and celery 6 to 8 minutes until soft.", "Add the garlic, cumin, paprika and thyme and cook 1 minute until fragrant.", "Stir in the tomatoes, lentils, broth and bay leaf. Bring to a boil, then cover and simmer 30 to 35 minutes, until the lentils are tender.", "Remove the bay leaf. Blend about 2 cups of the soup and return it to the pot for a creamier texture.", "Stir in the spinach until wilted, add the lemon juice and season with salt and pepper."] },

{ id: "italian-wedding-soup", n: "Italian Wedding Soup", c: "soups", s: "6", t: "1 hr",
  d: "Tiny tender meatballs, tiny pasta and greens in a savory chicken broth.",
  i: [[0.5, "lb", "ground beef"], [0.5, "lb", "ground pork"], [0.33, "cup", "panko breadcrumbs"], [0.5, "cup", "grated parmesan cheese", "plus more for serving"], [1, "", "egg"], [2, "tbsp", "fresh parsley", "chopped"], [2, "clove", "garlic", "minced, divided"], [0.5, "tsp", "salt"], [2, "tbsp", "olive oil"], [1, "", "yellow onion", "diced"], [2, "", "carrot", "diced"], [2, "stalk", "celery", "diced"], [10, "cup", "chicken broth"], [0.75, "cup", "acini di pepe pasta"], [5, "cup", "baby spinach"], [null, "", "black pepper"]],
  st: ["Mix the beef, pork, panko, parmesan, egg, parsley, half the garlic, salt and pepper. Roll into 3/4-inch meatballs.", "Heat the olive oil in a large pot over medium heat. Cook the onion, carrot and celery 6 minutes until soft, then add the remaining garlic for 1 minute.", "Add the broth and bring to a boil. Drop in the meatballs and simmer 10 minutes.", "Stir in the pasta and simmer 8 to 10 minutes more, until the pasta is tender and the meatballs are cooked through.", "Stir in the spinach until wilted, season with salt and pepper and serve with extra parmesan."] },

{ id: "pasta-e-fagioli", n: "Pasta e Fagioli", c: "soups", s: "6", t: "50 min",
  d: "Rustic Italian pasta and bean soup with pancetta, rosemary and tomato.",
  i: [[2, "tbsp", "olive oil"], [4, "oz", "pancetta", "diced"], [1, "", "yellow onion", "diced"], [1, "", "carrot", "diced"], [1, "stalk", "celery", "diced"], [4, "clove", "garlic", "minced"], [1, "sprig", "fresh rosemary"], [0.25, "tsp", "red pepper flakes"], [2, "tbsp", "tomato paste"], [1, "can", "diced tomatoes (14.5 oz)"], [2, "can", "cannellini beans (15 oz)", "drained and rinsed"], [6, "cup", "chicken broth"], [1, "cup", "ditalini pasta"], [0.5, "cup", "grated parmesan cheese"], [2, "tbsp", "fresh parsley", "chopped"], [null, "", "salt"], [null, "", "black pepper"]],
  st: ["Heat the olive oil in a large pot over medium heat and cook the pancetta 5 minutes until crisp. Add the onion, carrot and celery and cook 6 minutes until soft.", "Stir in the garlic, rosemary sprig, pepper flakes and tomato paste and cook 1 minute.", "Add the tomatoes, beans and broth. Simmer 15 minutes, then mash about a cup of the beans against the pot to thicken the soup.", "Remove the rosemary, add the ditalini and simmer 9 to 10 minutes, stirring often, until the pasta is tender.", "Season with salt and pepper and serve topped with parmesan, parsley and a drizzle of olive oil."] },

{ id: "beef-barley-soup", n: "Beef Barley Soup", c: "soups", s: "8", t: "2 hr",
  d: "A rich, stick-to-your-ribs soup of tender beef chuck, pearl barley, mushrooms and vegetables.",
  i: [[2, "lb", "beef chuck roast", "cut in 3/4-inch cubes"], [2, "tbsp", "vegetable oil"], [1, "", "yellow onion", "diced"], [3, "", "carrot", "diced"], [2, "stalk", "celery", "diced"], [8, "oz", "cremini mushrooms", "sliced"], [3, "clove", "garlic", "minced"], [2, "tbsp", "tomato paste"], [8, "cup", "beef broth"], [1, "tbsp", "Worcestershire sauce"], [4, "sprig", "fresh thyme"], [2, "", "bay leaf"], [0.75, "cup", "pearl barley", "rinsed"], [2, "tbsp", "fresh parsley", "chopped"], [null, "", "salt"], [null, "", "black pepper"]],
  st: ["Season the beef with salt and pepper. Heat the oil in a large Dutch oven over medium-high heat and brown the beef in batches, about 5 minutes per batch. Set aside.", "Reduce the heat to medium. Cook the onion, carrot, celery and mushrooms 8 minutes, until softened, then add the garlic and tomato paste for 1 minute.", "Return the beef, add the broth, Worcestershire, thyme and bay leaves and bring to a boil. Cover and simmer 1 hour.", "Stir in the barley and simmer, covered, 40 to 45 minutes more, until the beef and barley are tender.", "Remove the herb stems and bay leaves, season with salt and pepper and serve garnished with parsley."] },

{ id: "zuppa-toscana", n: "Zuppa Toscana", c: "soups", s: "6", t: "45 min",
  d: "Creamy Tuscan-style soup with spicy Italian sausage, bacon, potatoes and kale.",
  i: [[1, "lb", "Italian sausage", "hot, casings removed"], [4, "slice", "thick-cut bacon", "chopped"], [1, "", "yellow onion", "diced"], [4, "clove", "garlic", "minced"], [0.25, "tsp", "red pepper flakes"], [6, "cup", "chicken broth"], [4, "", "russet potato", "halved and sliced 1/4 inch thick"], [4, "cup", "lacinato kale", "stemmed and chopped"], [1, "cup", "heavy cream"], [0.25, "cup", "grated parmesan cheese"], [null, "", "salt"], [null, "", "black pepper"]],
  st: ["Brown the sausage in a large pot over medium-high heat, breaking it up, about 6 minutes. Transfer to a plate.", "Cook the bacon in the same pot until crisp, about 5 minutes. Remove, leaving 1 tablespoon of fat in the pot.", "Add the onion and cook 5 minutes until soft, then stir in the garlic and pepper flakes for 30 seconds.", "Add the broth and potatoes, bring to a boil and simmer 12 to 15 minutes until the potatoes are fork-tender.", "Return the sausage, stir in the kale and cream and simmer 5 minutes until the kale is tender. Season with salt and pepper and top with bacon and parmesan."] },

{ id: "wedge-salad", n: "Classic Wedge Salad", c: "soups", s: "4", t: "20 min",
  d: "Crisp iceberg wedges smothered in tangy homemade blue cheese dressing with bacon and tomatoes.",
  i: [[1, "head", "iceberg lettuce", "cut in 4 wedges"], [6, "slice", "thick-cut bacon", "chopped"], [0.75, "cup", "crumbled blue cheese", "divided"], [0.5, "cup", "mayonnaise"], [0.33, "cup", "sour cream"], [0.33, "cup", "buttermilk"], [1, "tsp", "Worcestershire sauce"], [0.5, "", "lemon", "juiced"], [1, "clove", "garlic", "grated"], [1, "pint", "cherry tomatoes", "halved"], [0.25, "", "red onion", "finely diced"], [2, "tbsp", "fresh chives", "chopped"], [null, "", "salt"], [null, "", "black pepper"]],
  st: ["Cook the bacon in a skillet over medium heat 8 to 10 minutes until crisp. Drain on paper towels.", "Whisk the mayonnaise, sour cream, buttermilk, Worcestershire, lemon juice and garlic. Stir in half the blue cheese and season with salt and pepper.", "Chill the dressing at least 15 minutes to let the flavors meld.", "Place a cold iceberg wedge on each plate and spoon the dressing generously over the top.", "Scatter with the bacon, tomatoes, red onion, remaining blue cheese and chives and finish with black pepper."] },

{ id: "waldorf-salad", n: "Waldorf Salad", c: "soups", s: "4", t: "15 min",
  d: "The classic crunchy salad of crisp apples, celery, grapes and toasted walnuts in a light lemony mayonnaise dressing.",
  i: [[0.5, "cup", "chopped walnuts"], [0.33, "cup", "mayonnaise"], [0.33, "cup", "plain whole-milk yogurt"], [0.5, "", "lemon", "juiced"], [1, "tsp", "honey"], [2, "", "Honeycrisp apple", "cored and diced"], [1, "", "Granny Smith apple", "cored and diced"], [2, "stalk", "celery", "thinly sliced"], [1, "cup", "red seedless grapes", "halved"], [0.5, "head", "romaine lettuce", "leaves separated"], [null, "", "salt"], [null, "", "black pepper"]],
  st: ["Toast the walnuts in a dry skillet over medium heat 4 to 5 minutes, stirring, until fragrant. Let cool.", "Whisk the mayonnaise, yogurt, lemon juice and honey in a large bowl and season with salt and pepper.", "Add the apples right after dicing and toss to coat so they don't brown.", "Fold in the celery, grapes and most of the walnuts.", "Serve on the lettuce leaves topped with the remaining walnuts."] },

{ id: "spinach-strawberry-salad", n: "Spinach Strawberry Salad", c: "soups", s: "4", t: "20 min",
  d: "Fresh spinach and sweet strawberries with toasted almonds, feta and a tangy poppy seed dressing.",
  i: [[0.5, "cup", "sliced almonds"], [0.25, "cup", "olive oil"], [3, "tbsp", "apple cider vinegar"], [2, "tbsp", "honey"], [1, "tsp", "Dijon mustard"], [1, "tsp", "poppy seeds"], [6, "cup", "baby spinach"], [2, "cup", "strawberries", "hulled and sliced"], [0.25, "", "red onion", "thinly sliced"], [0.5, "cup", "crumbled feta cheese"], [null, "", "salt"], [null, "", "black pepper"]],
  st: ["Toast the almonds in a dry skillet over medium heat 3 to 4 minutes, stirring, until golden. Let cool.", "Whisk the olive oil, vinegar, honey, mustard and poppy seeds and season with salt and pepper.", "Combine the spinach, strawberries and red onion in a large bowl.", "Toss with just enough dressing to coat.", "Top with the feta and toasted almonds and serve with the remaining dressing on the side."] },

{ id: "classic-chicken-salad", n: "Classic Chicken Salad", c: "soups", s: "4", t: "35 min",
  d: "Creamy deli-style chicken salad with tender poached chicken, crunchy celery and fresh herbs.",
  i: [[1.5, "lb", "boneless skinless chicken breasts"], [1, "tsp", "salt", "for poaching"], [0.5, "cup", "mayonnaise"], [1, "tsp", "Dijon mustard"], [0.5, "", "lemon", "juiced"], [2, "stalk", "celery", "finely diced"], [2, "", "green onion", "thinly sliced"], [2, "tbsp", "fresh parsley", "chopped"], [1, "tbsp", "fresh dill", "chopped"], [null, "", "salt"], [null, "", "black pepper"]],
  st: ["Place the chicken in a saucepan, cover by 1 inch with cold water and add the salt. Bring to a gentle simmer over medium heat.", "Cover, turn off the heat and let stand 15 to 18 minutes, until the chicken reaches 160°F.", "Cool the chicken, then chop or shred into bite-size pieces.", "Stir the mayonnaise, mustard and lemon juice together in a bowl. Add the chicken, celery, green onion, parsley and dill and fold to combine.", "Season with salt and pepper and chill at least 30 minutes. Serve on sandwiches, croissants or lettuce."] },

// ---------- CHICKEN ----------
{ id: "butter-chicken", n: "Butter Chicken", c: "chicken", s: "4", t: "1 hr",
  d: "Tender yogurt-marinated chicken in a silky, mildly spiced tomato-butter-cream sauce (murgh makhani).",
  i: [[2, "lb", "boneless skinless chicken thighs", "cut in bite-size pieces"], [0.5, "cup", "plain whole-milk yogurt"], [1, "tbsp", "fresh ginger", "grated, divided"], [6, "clove", "garlic", "minced, divided"], [2, "tsp", "garam masala", "divided"], [2, "tsp", "Kashmiri chili powder", "divided"], [0.5, "tsp", "ground turmeric"], [1, "tsp", "salt"], [1, "tbsp", "vegetable oil"], [4, "tbsp", "unsalted butter"], [1, "", "yellow onion", "finely chopped"], [1, "tsp", "ground cumin"], [1, "can", "crushed tomatoes (28 oz)"], [0.75, "cup", "heavy cream"], [1, "tsp", "granulated sugar"], [1, "tbsp", "dried fenugreek leaves", "crushed"], [0.25, "cup", "fresh cilantro", "chopped"], [1.5, "cup", "basmati rice", "for serving"]],
  st: ["Marinate the chicken with the yogurt, half the ginger and garlic, 1 teaspoon each garam masala and chili powder, the turmeric and salt for at least 30 minutes.", "Heat the oil in a large skillet over medium-high heat and sear the chicken in batches 3 to 4 minutes per side, until charred in spots. Set aside.", "Melt the butter in the same pan over medium heat. Cook the onion 6 minutes until soft, then add the remaining ginger, garlic, garam masala, chili powder and the cumin for 1 minute.", "Add the crushed tomatoes and simmer 10 to 15 minutes, then blend until smooth.", "Stir in the cream, sugar and fenugreek, return the chicken and simmer 8 to 10 minutes until cooked through.", "Garnish with cilantro and serve over basmati rice."] },

{ id: "orange-chicken", n: "Orange Chicken", c: "chicken", s: "4", t: "40 min",
  d: "Crispy fried chicken bites glazed in a sticky, sweet and tangy fresh orange sauce.",
  i: [[1.5, "lb", "boneless skinless chicken thighs", "cut in 1-inch pieces"], [1, "", "egg", "beaten"], [0.5, "cup", "cornstarch", "plus 1 tbsp for the sauce"], [0.25, "cup", "all-purpose flour"], [0.5, "tsp", "salt"], [1, "cup", "vegetable oil", "for frying"], [2, "", "orange", "zested and juiced (about 2/3 cup juice)"], [0.33, "cup", "granulated sugar"], [3, "tbsp", "soy sauce"], [2, "tbsp", "rice vinegar"], [1, "tbsp", "fresh ginger", "grated"], [3, "clove", "garlic", "minced"], [0.25, "tsp", "red pepper flakes"], [2, "", "green onion", "sliced"], [1, "tsp", "sesame seeds"], [1.5, "cup", "jasmine rice", "for serving"]],
  st: ["Toss the chicken with the egg, then dredge in the 1/2 cup cornstarch mixed with the flour and salt.", "Heat the oil in a large skillet or wok to 350°F and fry the chicken in batches 4 to 5 minutes, turning, until golden and cooked through. Drain on a rack.", "In a small saucepan, combine the orange zest and juice, sugar, soy sauce, vinegar, ginger, garlic and pepper flakes and bring to a simmer.", "Stir the remaining 1 tablespoon cornstarch with 2 tablespoons water, add to the sauce and simmer 1 to 2 minutes until thick and glossy.", "Toss the crispy chicken in the sauce and serve over rice topped with green onion and sesame seeds."] },

{ id: "kung-pao-chicken", n: "Kung Pao Chicken", c: "chicken", s: "4", t: "35 min",
  d: "Sichuan stir-fry of tender chicken, peanuts and dried chiles in a glossy, tingly sweet-savory sauce.",
  i: [[1.5, "lb", "boneless skinless chicken thighs", "cut in 3/4-inch pieces"], [2, "tbsp", "soy sauce", "divided"], [1, "tbsp", "Shaoxing wine"], [2, "tsp", "cornstarch", "divided"], [1, "tbsp", "Chinkiang black vinegar"], [1, "tbsp", "granulated sugar"], [1, "tsp", "toasted sesame oil"], [3, "tbsp", "vegetable oil"], [10, "", "whole dried red chile", "halved and seeded"], [1, "tsp", "Sichuan peppercorns"], [3, "clove", "garlic", "sliced"], [1, "tbsp", "fresh ginger", "minced"], [4, "", "green onion", "cut in 1-inch pieces"], [0.5, "cup", "dry-roasted peanuts"], [1.5, "cup", "jasmine rice", "for serving"]],
  st: ["Toss the chicken with 1 tablespoon soy sauce, the Shaoxing wine and 1 teaspoon cornstarch and marinate 15 minutes.", "Stir the remaining soy sauce and cornstarch with the vinegar, sugar, sesame oil and 2 tablespoons water to make the sauce.", "Heat the oil in a wok over medium heat. Add the chiles and Sichuan peppercorns and stir-fry 30 seconds until fragrant and the chiles darken.", "Raise the heat to high, add the chicken and stir-fry 4 to 5 minutes until lightly browned and nearly cooked through.", "Add the garlic, ginger and green onions and stir-fry 1 minute. Pour in the sauce and toss 1 minute until glossy.", "Stir in the peanuts and serve immediately with rice."] },

{ id: "chicken-cordon-bleu", n: "Chicken Cordon Bleu", c: "chicken", s: "4", t: "50 min",
  d: "Crispy baked chicken rolled around ham and Swiss cheese, served with a creamy Dijon sauce.",
  i: [[4, "", "boneless skinless chicken breasts", "pounded 1/4 inch thick (about 2 lb)"], [8, "slice", "thinly sliced deli ham"], [8, "slice", "Swiss cheese"], [0.5, "cup", "all-purpose flour"], [2, "", "egg", "beaten"], [1.5, "cup", "panko breadcrumbs"], [4, "tbsp", "unsalted butter", "melted, divided"], [1, "tbsp", "all-purpose flour", "for the sauce"], [1, "cup", "whole milk"], [1, "tbsp", "Dijon mustard"], [0.25, "cup", "grated parmesan cheese"], [null, "", "salt"], [null, "", "black pepper"]],
  st: ["Heat the oven to 400°F. Season the chicken with salt and pepper and layer 2 slices each of ham and Swiss on each breast.", "Roll up tightly from the short end and secure with toothpicks.", "Dredge each roll in flour, dip in egg, then coat in the panko tossed with 3 tablespoons of the melted butter. Place seam-side down on a parchment-lined sheet pan.", "Bake 30 to 35 minutes, until golden and the chicken reaches 165°F. Rest 5 minutes and remove the toothpicks.", "Meanwhile, cook the remaining butter and 1 tablespoon flour in a saucepan 1 minute, whisk in the milk and simmer 3 minutes until thick. Stir in the mustard and parmesan and season.", "Slice the chicken and serve with the Dijon cream sauce."] },

{ id: "southern-fried-chicken", n: "Southern Fried Chicken", c: "chicken", s: "4", t: "1 hr + brining",
  d: "Buttermilk-brined chicken with a craggy, well-seasoned crust, fried until shatteringly crisp and juicy.",
  i: [[1, "", "whole chicken (about 4 lb)", "cut into 8 pieces"], [2, "cup", "buttermilk"], [2, "tbsp", "cayenne hot sauce"], [1, "tbsp", "salt", "divided"], [2, "cup", "all-purpose flour"], [1, "tbsp", "baking powder"], [2, "tsp", "smoked paprika"], [1, "tsp", "garlic powder"], [1, "tsp", "onion powder"], [0.5, "tsp", "cayenne pepper"], [1, "tsp", "black pepper"], [6, "cup", "vegetable oil", "for frying"]],
  st: ["Whisk the buttermilk, hot sauce and 2 teaspoons salt, add the chicken and refrigerate at least 4 hours or overnight.", "Whisk the flour, baking powder, paprika, garlic powder, onion powder, cayenne, pepper and remaining salt in a large bowl. Drizzle in 3 tablespoons of the brine and rub in to create shaggy bits.", "Dredge each piece in the flour mixture, pressing to coat, and rest on a rack 15 minutes.", "Heat 1.5 inches of oil in a large cast-iron skillet or Dutch oven to 350°F. Fry the chicken in batches, maintaining 300 to 325°F, 12 to 15 minutes, turning occasionally, until deep golden.", "Check that white meat reaches 160°F and dark meat 175°F. Drain on a wire rack and season with a pinch of salt before serving."] },

{ id: "baked-bbq-drumsticks", n: "Baked BBQ Chicken Drumsticks", c: "chicken", s: "4", t: "55 min",
  d: "Smoky dry-rubbed drumsticks oven-baked until tender, then glazed with sticky BBQ sauce.",
  i: [[3, "lb", "chicken drumsticks"], [1, "tbsp", "vegetable oil"], [1, "tbsp", "brown sugar"], [2, "tsp", "smoked paprika"], [1, "tsp", "garlic powder"], [1, "tsp", "onion powder"], [1, "tsp", "chili powder"], [1, "tsp", "salt"], [0.5, "tsp", "black pepper"], [1, "cup", "BBQ sauce"], [1, "tbsp", "fresh parsley", "chopped"]],
  st: ["Heat the oven to 425°F and set a wire rack over a foil-lined sheet pan.", "Pat the drumsticks dry and toss with the oil. Mix the brown sugar, paprika, garlic powder, onion powder, chili powder, salt and pepper and rub all over the chicken.", "Arrange on the rack and bake 35 minutes, turning once halfway through.", "Brush generously with BBQ sauce and bake 10 minutes more. Brush again and broil 2 to 3 minutes until sticky and caramelized.", "Check that the chicken reaches at least 175°F, garnish with parsley and serve with extra sauce."] },

{ id: "chicken-and-dumplings", n: "Chicken and Dumplings", c: "chicken", s: "6", t: "1 hr 15 min",
  d: "Comforting Southern stew of tender chicken and vegetables in a creamy broth topped with fluffy drop dumplings.",
  i: [[2, "lb", "boneless skinless chicken thighs"], [4, "tbsp", "unsalted butter"], [1, "", "yellow onion", "diced"], [2, "", "carrot", "sliced"], [2, "stalk", "celery", "sliced"], [3, "clove", "garlic", "minced"], [0.33, "cup", "all-purpose flour"], [6, "cup", "chicken broth"], [0.5, "cup", "heavy cream"], [4, "sprig", "fresh thyme"], [1, "", "bay leaf"], [1, "cup", "frozen peas"], [2, "cup", "all-purpose flour", "for the dumplings"], [1, "tbsp", "baking powder"], [1, "tsp", "salt", "for the dumplings"], [0.75, "cup", "whole milk"], [3, "tbsp", "unsalted butter", "melted, for the dumplings"], [2, "tbsp", "fresh parsley", "chopped"], [null, "", "salt"], [null, "", "black pepper"]],
  st: ["Melt the 4 tablespoons butter in a large Dutch oven over medium heat. Cook the onion, carrot and celery 6 to 8 minutes, then add the garlic for 1 minute.", "Sprinkle in the 1/3 cup flour and cook 1 minute, then slowly whisk in the broth. Add the chicken, thyme and bay leaf and simmer, covered, 25 minutes until the chicken is tender.", "Remove the chicken, shred it and return it to the pot with the cream and peas. Discard the thyme stems and bay leaf and season with salt and pepper.", "Whisk the 2 cups flour, baking powder and 1 teaspoon salt, then stir in the milk, melted butter and parsley just until a soft dough forms.", "Drop heaping tablespoons of dough over the simmering stew. Cover and cook on low 15 minutes without lifting the lid, until the dumplings are puffed and cooked through."] },

{ id: "greek-chicken-souvlaki", n: "Greek Chicken Souvlaki", c: "chicken", s: "4", t: "40 min + marinating",
  d: "Lemon-garlic-oregano marinated chicken skewers grilled and tucked into warm pitas with homemade tzatziki.",
